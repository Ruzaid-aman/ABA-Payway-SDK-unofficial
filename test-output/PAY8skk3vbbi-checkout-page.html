<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>PayWay Cards Checkout — PAY8skk3vbbi</title>
<script src="https://checkout.payway.com.kh/plugins/checkout2-0.js" defer></script>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; margin: 0; }
  .box { text-align: center; }
  button { font-size: 1rem; padding: 12px 28px; border-radius: 8px; border: 0;
           background: #00bcd4; color: #fff; cursor: pointer; }
  p { color: #555; }
</style>
</head>
<body>
  <div class="box">
    <h2>ABA PayWay — Card Checkout</h2>
    <p>Transaction <strong>PAY8skk3vbbi</strong> · USD 7.77</p>
    <noscript><p style="color:#b00020">JavaScript is required for the PayWay modal.</p></noscript>
    <button id="pay-btn" type="button">Open PayWay checkout</button>
    <p id="status">Opening…</p>
  </div>

  <form method="POST" target="aba_webservice" id="aba_merchant_request" action="https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase">
    <input type="hidden" name="tran_id" value="PAY8skk3vbbi" />
    <input type="hidden" name="amount" value="7.77" />
    <input type="hidden" name="type" value="purchase" />
    <input type="hidden" name="payment_option" value="cards" />
    <input type="hidden" name="currency" value="USD" />
    <input type="hidden" name="view_type" value="hosted_view" />
    <input type="hidden" name="payment_gate" value="0" />
    <input type="hidden" name="lifetime" value="600" />
    <input type="hidden" name="req_time" value="20260825150015" />
    <input type="hidden" name="merchant_id" value="ec476910" />
    <input type="hidden" name="hash" value="91UWMKfacyKFucznDpMeoZVTFq9t+Jt9taJacro7fPbwVOvghFbtTDbRhcCOZ70Sw4QTxiDSq6etPi9GOW8lRQ==" />
  </form>

  <script>
    function startCheckout() {
      document.getElementById('status').textContent = 'Contacting PayWay…';
      if (window.AbaPayway && typeof window.AbaPayway.checkout === 'function') {
        AbaPayway.checkout(); // modal popup on desktop / bottom sheet on mobile
      } else {
        // Plugin not loaded (offline?) — fall back to hosted view navigation.
        document.getElementById('aba_merchant_request').submit();
      }
      document.getElementById('status').textContent =
        'If no window opened, click again or submit the form directly.';
    }
    document.getElementById('pay-btn').addEventListener('click', startCheckout);
    window.addEventListener('load', function () {
      setTimeout(startCheckout, 600); // give the deferred plugin a beat to attach
    });
  </script>
</body>
</html>
