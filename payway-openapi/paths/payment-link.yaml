# Payment Link — Paths

/api/merchant-portal/merchant-access/payment-link/create:
  post:
    operationId: createPaymentLink
    summary: Create a payment link
    tags: [Payment Link]
    description: >
      Generates a shareable payment link that can be sent to customers
      via SMS, email, chat, or any messaging platform. The link opens
      PayWay's hosted checkout page. Requires RSA-encrypted merchant_auth.
      Sandbox-verified: `currency` and `return_url` are REQUIRED inside
      merchant_auth — the gateway responds PTL04 "Parameter validation
      required" when either is omitted (undocumented in official docs).
    x-hmac-fields:
      - request_time
      - merchant_id
      - merchant_auth
    x-merchant-auth-encryption:
      algorithm: RSA public-key encryption, PKCS1 padding
      chunk_size_bytes: 117
      plaintext_shape:
        mc_id: "same value as merchant_id"
        title: "title of the payment link (max 250 chars)"
        amount: "payment amount (min 100 KHR / 0.01 USD, not null/zero)"
        currency: "USD or KHR — REQUIRED (PTL04 when omitted)"
        description: "optional description of the payment link (max 250 characters — PTL04 when exceeded)"
        payment_limit: "optional limit on payments (blank = unlimited)"
        expired_date: "expiration timestamp in seconds (a null value means no expiry; sample passes time())"
        return_url: "base64-encoded callback URL — REQUIRED (PTL04 when omitted)"
        merchant_ref_no: "optional merchant-side link reference (max 50, echoed in callback)"
        payout: "optional JSON [{acc, amt}] — total payout must equal the link amount"
      process: >
        JSON-encode the plaintext shape -> split into 117-byte chunks ->
        RSA-encrypt each chunk -> concatenate -> base64 encode into
        merchant_auth field. The optional top-level `image` (max 3MB,
        JPG/JPEG/PNG) is sent as a multipart part and never hashed.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../components/schemas/payment-link.yaml#/CreatePaymentLinkRequest'
    responses:
      '200':
        description: Payment link creation result
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-link.yaml#/CreatePaymentLinkResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/merchant-portal/merchant-access/payment-link/detail:
  post:
    operationId: getPaymentLinkDetails
    summary: Get payment link details
    tags: [Payment Link]
    description: >
      Retrieves the status and details of a previously created payment link.
      Also uses RSA-encrypted merchant_auth. The `id` is the `data.id` value
      returned by the create endpoint — NOT the slug in the payment_link URL.
    x-hmac-fields:
      - request_time
      - merchant_id
      - merchant_auth
    x-merchant-auth-encryption:
      algorithm: RSA public-key encryption, PKCS1 padding
      chunk_size_bytes: 117
      plaintext_shape:
        mc_id: "same value as merchant_id"
        id: "the payment link ID to query (e.g. T+ErECeC9uCGj90ylqGUvw==)"
      process: >
        JSON-encode {mc_id, id} -> RSA-encrypt in 117-byte chunks ->
        base64 encode into merchant_auth.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-link.yaml#/GetPaymentLinkDetailsRequest'
    responses:
      '200':
        description: Payment link details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-link.yaml#/GetPaymentLinkDetailsResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/merchant-portal/merchant-access/payment-link/void:
  post:
    operationId: voidPaymentLink
    summary: Void (cancel) a payment link
    tags: [Payment Link]
    description: >
      Voids a previously created payment link before it has been paid. Once
      voided the link can no longer receive payments and the action CANNOT
      be reversed. UNDOCUMENTED by PayWay (no official docs page) — the full
      contract is live-verified on the sandbox (SANDBOX-FINDINGS §23,
      2026-09-11): same request family as detail (RSA-encrypted
      merchant_auth carrying {mc_id, id}); Content-Type lenient (both
      application/json and urlencoded accepted); success answers
      {status:{code:"00",message:"Success."}, tran_id} with a NUMERIC
      tran_id; double-void answers HTTP 403 code PTL188 "The payment link
      is already voided."; a bogus link id answers HTTP 403 code 96
      "Invalid merchant data". Post-void, detail reports status "VOIDED"
      and the hosted page renders an invalid-data shell (page code 07).
    x-hmac-fields:
      - request_time
      - merchant_id
      - merchant_auth
    x-merchant-auth-encryption:
      algorithm: RSA public-key encryption, PKCS1 padding
      chunk_size_bytes: 117
      plaintext_shape:
        mc_id: "same value as merchant_id"
        id: "the payment link ID to void (the data.id value returned by create — NOT the URL slug)"
      process: >
        JSON-encode {mc_id, id} -> RSA-encrypt in 117-byte chunks ->
        base64 encode into merchant_auth.
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/payment-link.yaml#/VoidPaymentLinkRequest'
        application/json:
          schema:
            $ref: '../components/schemas/payment-link.yaml#/VoidPaymentLinkRequest'
    responses:
      '200':
        description: Payment link voided (terminal — a second void answers 403 PTL188)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-link.yaml#/VoidPaymentLinkResponse'
      '4XX':
        description: Client error (PTL188 already voided, 96 invalid link id, wrong hash)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'
