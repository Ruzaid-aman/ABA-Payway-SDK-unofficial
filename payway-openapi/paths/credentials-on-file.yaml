# Credentials on File — Paths
# Endpoints: Link Account, Link Card, Payment, Renew Token, Get Token Details, Remove Token
# (Subscription is documented by ABA as a parameter set on the Purchase path — see ecommerce-checkout.yaml)
#
# 2026-08-31 live-docs sync (developer.payway.com.kh):
# - Link Account/Card/Payment hash orders BELOW are the SANDBOX-VERIFIED orders (SANDBOX-FINDINGS §9a).
#   The live Apidog pages document different orders (noted per operation) — reconcile via
#   scripts/probe-token-trio.ts before changing the SDK.
# - The token-management trio orders below are the LIVE-DOCUMENTED orders (not yet sandbox-verified).

/api/payment-credential/v3/aof/link-account:
  post:
    operationId: linkAccount
    summary: Link an ABA account to your platform
    tags: [Credentials on File]
    description: >
      Returns a QR code or ABA Mobile deeplink, enabling users to scan or
      use the deeplink to launch ABA Mobile and select an account to link.
      Once linked, PayWay sends account details and token to the merchant
      via callback_url. The QR/deeplink expires in 10 minutes.
      Live docs mark ctid, token_flag, and currency as REQUIRED.
    x-hmac-fields:
      # Sandbox-verified order (SANDBOX-FINDINGS §9a). Live Apidog page documents:
      # merchant_id, request_time, ctid, return_deeplink, callback_url, request_id, token_flag, currency
      - request_time
      - merchant_id
      - request_id
      - ctid
      - return_deeplink
      - token_flag
      - currency
      - callback_url
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/LinkAccountRequest'
    responses:
      '200':
        description: QR code or deeplink for account linking
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/LinkAccountResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/payment-credential/v3/cof/link-card:
  post:
    operationId: linkCard
    summary: Link a credit/debit card to your platform
    tags: [Credentials on File]
    description: >
      Securely stores a customer's credit/debit card. ALWAYS responds with
      an HTML page (Visa/Mastercard/JCB/UPI form) to render in an iframe —
      on success AND on error; the token is delivered via callback_url.
      Live docs mark ctid, token_flag, and currency as REQUIRED.
    x-hmac-fields:
      # Sandbox-verified order (SANDBOX-FINDINGS §9a). Live Apidog page documents:
      # merchant_id, request_time, ctid, callback_url, request_id, token_flag, frequency, amount, currency, continue_success_url
      # — where frequency and amount are hash positions with NO request fields (pass '').
      - request_time
      - merchant_id
      - request_id
      - ctid
      - return_deeplink
      - token_flag
      - frequency
      - return_url
      - callback_url
      - currency
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/LinkCardRequest'
    responses:
      '200':
        description: Hosted card-linking HTML page (returned on success AND error)
        content:
          text/html:
            schema:
              type: string
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/payment-gateway/v3/purchase/payment-credential:
  post:
    operationId: cofPayment
    summary: Charge a stored payment token
    tags: [Credentials on File]
    description: >
      Initiates a payment using a previously linked account or card token.
      Live-documented token_flag values: CITU_FLEX, MITU_FLEX, MITR_FIX
      (ensure the merchant profile enables the matching business case).
      Amount floor: KHR >= 100, USD >= 0.01.
    x-hmac-fields:
      # Sandbox-verified order (SANDBOX-FINDINGS §9a; request_id is SDK-observed
      # but ABSENT from the live Apidog page). Live Apidog page documents:
      # request_time, merchant_id, tran_id, amount, currency, items, ctid, pwt,
      # first_name, last_name, email, phone, purchase_type, callback_url,
      # custom_fields, return_params, payout, token_flag, shipping_fee
      - request_time
      - merchant_id
      - request_id
      - tran_id
      - amount
      - ctid
      - pwt
      - token_flag
      - currency
      - callback_url
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/CofPaymentRequest'
    responses:
      '200':
        description: Payment result
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/CofPaymentResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/payment-credential/v3/token-management/renew-expired-account-token:
  post:
    operationId: renewToken
    summary: Renew an existing payment token
    tags: [Credentials on File]
    description: >
      Renews an expired (or expiring) ACCOUNT token — card tokens cannot be
      renewed. CITI_FLEX/CITO_FLEX tokens expire 90 days after linking,
      renewal, or the last successful transaction (whichever is most
      recent). Renewal extends by 90 days. A callback is expected within
      3 minutes; otherwise fall back to Get Token Details.
    x-hmac-fields:
      # 2026-08-31 live-docs order (developer.payway.com.kh renew-token-19336823e0) —
      # NOT yet sandbox-verified; probe via scripts/probe-token-trio.ts.
      - ctid
      - request_time
      - pwt
      - merchant_id
      - request_id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/RenewTokenRequest'
    responses:
      '200':
        description: New token details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/RenewTokenResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/payment-credential/v3/token-management/get-token-details:
  post:
    operationId: getTokenDetails
    summary: Get details of a linked account or card token
    tags: [Credentials on File]
    description: >
      Manual retrieval when a link/renew callback was missed. Per the live
      docs this endpoint takes ONLY request_time, merchant_id, and
      request_id — no ctid and no pwt.
    x-hmac-fields:
      # 2026-08-31 live-docs order (developer.payway.com.kh get-token-details-19336824e0) —
      # NOT yet sandbox-verified; probe via scripts/probe-token-trio.ts.
      - merchant_id
      - request_time
      - request_id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/GetTokenDetailsRequest'
    responses:
      '200':
        description: Token details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/GetTokenDetailsResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'

/api/payment-credential/v3/token-management/remove-token:
  post:
    operationId: removeToken
    summary: Remove a stored payment token
    tags: [Credentials on File]
    description: >
      Removes a linked account OR card token. IRREVERSIBLE — future
      charges decline with purchase error 87 and the ABA Mobile user is
      notified. Users can also remove the token themselves in ABA Mobile;
      the merchant then receives a CoF callback with status 0.
    x-hmac-fields:
      # 2026-08-31 live-docs order (developer.payway.com.kh remove-token-19336822e0) —
      # NOT yet sandbox-verified; probe via scripts/probe-token-trio.ts.
      # Request fields: request_time, merchant_id, ctid, pwt (no request_id).
      - merchant_id
      - ctid
      - request_time
      - pwt
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/RemoveTokenRequest'
    responses:
      '200':
        description: Token removal result
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/RemoveTokenResponse'
      '4XX':
        description: Client error (invalid hash, missing parameters, validation failure)
        content:
          application/json:
            schema:
              $ref: '../components/schemas/shared.yaml#/ErrorResponse'
