# Credentials on File — Paths
# Endpoints: Link Account, Link Card, Payment, Renew Token, Get Token Details, Remove Token, Subscription

/api/payment-credential/v3/aof/link-account:
  post:
    operationId: linkAccount
    summary: Link an ABA account to your platform
    tags: [Credentials on File]
    description: >
      Returns a QR code or ABA Mobile deeplink, enabling users to scan or
      use the deeplink to launch ABA Mobile and select an account to link.
      Once linked, PayWay sends account details and token to the merchant
      via callback_url.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - ctid
      - return_deeplink
      - token_flag
      - currency
      - callback_url
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/LinkAccountRequest'
    responses:
      '200':
        description: QR code or deeplink for account linking
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/LinkAccountResponse'

/api/payment-credential/v3/cof/link-card:
  post:
    operationId: linkCard
    summary: Link a credit/debit card to your platform
    tags: [Credentials on File]
    description: >
      Securely stores a customer's credit/debit card. Returns a hosted
      checkout page or token depending on integration type.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - ctid
      - return_deeplink
      - token_flag
      - frequency
      - return_url
      - callback_url
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/LinkCardRequest'
    responses:
      '200':
        description: Hosted checkout for card linking
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/LinkCardResponse'

/api/payment-gateway/v3/purchase/payment-credential:
  post:
    operationId: cofPayment
    summary: Charge a stored payment token
    tags: [Credentials on File]
    description: >
      Initiates a payment using a previously linked account or card token.
      Supports both customer-initiated (CITR) and merchant-initiated (MITR)
      transactions. Use token_flag to specify the context.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - tran_id
      - amount
      - ctid
      - pwt
      - token_flag
      - currency
      - callback_url
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/CofPaymentRequest'
    responses:
      '200':
        description: Payment result
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/CofPaymentResponse'

/api/payment-credential/v3/token-management/renew-expired-account-token:
  post:
    operationId: renewToken
    summary: Renew an existing payment token
    tags: [Credentials on File]
    description: >
      Used to update or refresh existing payment credentials before they
      expire. Generates a new token while keeping the linked account/card.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - ctid
      - pwt
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/RenewTokenRequest'
    responses:
      '200':
        description: New token details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/RenewTokenResponse'

/api/payment-credential/v3/token-management/get-token-details:
  post:
    operationId: getTokenDetails
    summary: Get details of a linked account or card token
    tags: [Credentials on File]
    description: >
      Retrieves the details associated with a stored payment token,
      including masked account/card information and token status.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - ctid
      - pwt
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/GetTokenDetailsRequest'
    responses:
      '200':
        description: Token details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/GetTokenDetailsResponse'

/api/payment-credential/v3/token-management/remove-token:
  post:
    operationId: removeToken
    summary: Remove a stored payment token
    tags: [Credentials on File]
    description: >
      Deletes the stored account or card token. Once removed, the token
      can no longer be used for payments or renewals.
    x-hmac-fields:
      - request_time
      - merchant_id
      - request_id
      - ctid
      - pwt
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credentials-on-file.yaml#/RemoveTokenRequest'
    responses:
      '200':
        description: Token removal result
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credentials-on-file.yaml#/RemoveTokenResponse'
