    GetTransactionsByMcRefRequest:
      type: object
      required:
        - req_time
        - merchant_id
        - merchant_ref
        - hash
      properties:
        req_time:
          type: string
          description: UTC timestamp, format YYYYMMDDHHmmss.
          example: '20250213084236'
        merchant_id:
          type: string
          description: Merchant key issued by ABA Bank.
          example: ec000002
        merchant_ref:
          type: string
          description: Merchant reference number.
          example: '17394277693'
        hash:
          type: string
          description: base64(HMAC-SHA512(req_time + merchant_id + merchant_ref, api_key)).
    KhqrTransaction:
      type: object
      properties:
        transaction_id:
          type: string
        transaction_date:
          type: string
        bank_ref:
          type: string
        apv:
          type: string
        discount_amount:
          type: number
        payment_status:
          type: string
        payment_amount:
          type: number
        payment_currency:
          type: string
        payment_type:
          type: string
        payer_account:
          type: string
        total_amount:
          type: number
        original_amount:
          type: number
        original_currency:
          type: string
        payment_status_code:
          type: integer
        bank_name:
          type: string
        refund_amount:
          type: number
        merchant_ref:
          type: string
    GetTransactionsByMcRefResponse:
      type: object
      description: |
        Response envelope as merchant-captured in production (2026-08): rows under `data`, status under a nested `status` object with STRING code ("00" = Success). The official doc page models {status: integer, transactions: []} but every captured production response uses the data/status-object shape; consumers should tolerate both (SDK normalizes). Status codes: "00"/0=Success, 1=Wrong hash, 8=Invalid merchant profile, 11=Internal server error.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KhqrTransaction'
        status:
          type: object
          properties:
            code:
              oneOf:
                - type: string
                  description: '"00" = Success (captured production shape)'
                - type: integer
                  description: 0 = Success (doc-page shape)
            message:
              type: string
            merchant_ref:
              type: string
        transactions:
          type: array
          description: Legacy doc-page row slot — production captures use `data`.
          items:
            $ref: '#/components/schemas/KhqrTransaction'
    PaymentCallbackBody:
      type: object
      description: |
        Body shape is NOT fixed — PayWay states additional fields may be present depending on payment method. Treat unknown keys as pass-through when computing the signature (item 3 in info.description sorts ALL present keys, not a fixed subset).
      required:
        - tran_id
        - apv
        - status
      properties:
        tran_id:
          type: string
          description: The tran_id supplied on the original purchase call.
        apv:
          type: string
          description: Transaction approval code.
        status:
          type: string
          description: Payment status for this callback.
        return_params:
          type: string
          description: Echoes the return_params value from the original purchase request, if any was supplied.
