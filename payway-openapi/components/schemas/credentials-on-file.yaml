# Credentials on File — Schemas
# 2026-08-31 sync with developer.payway.com.kh (link-account-19336820e0,
# link-card-19336819e0, payment-19336821e0, renew-token-19336823e0,
# get-token-details-19336824e0, remove-token-19336822e0).
# 2026-09-02 §16 re-sync (audit D8): required-ness and sent-field set follow the
# sandbox-verified live-doc compositions (docs/SANDBOX-FINDINGS.md §16):
# link-card sends NO return_url/return_deeplink; CoF payment sends NO request_id.

LinkAccountRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, token_flag, currency, hash]
  properties:
    request_id:
      type: string
      description: Unique request identifier generated by the merchant. 5–24 chars, letters+digits only. "We only return the last record" for a reused request_id.
    request_time:
      type: string
      description: UTC timestamp, format YYYYMMDDHHmmss.
    merchant_id:
      type: string
      description: Merchant key issued by ABA Bank.
    ctid:
      type: string
      description: Customer token identifier — merchant-side unique ID for the customer. 5–24 chars, letters+digits only. Required per live docs.
    return_deeplink:
      type: string
      description: Base64-encoded JSON {ios_scheme, android_scheme} for mobile app integration.
    token_flag:
      type: string
      enum: [CITI_FLEX, CITO_FLEX]
      description: >
        Live docs list CITI_FLEX (customer-initiated, variable amount) and
        CITO_FLEX (merchant charges later, variable) for link-account.
        Sandbox additionally accepted CITO_FIX / CITR_FLEX (§9b) — keep
        sending them only if the merchant profile enables them.
    currency:
      type: string
      enum: [KHR, USD]
      description: Required per live docs (profile-enabled currency).
    callback_url:
      type: string
      description: Base64-encoded URL where PayWay sends the account details and token after linking. Defaults to the profile pushback_url.
    hash:
      type: string
      description: base64(HMAC-SHA512(concat_in_x-hmac-fields-order, api_key)).

LinkAccountResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code:
          type: string
          description: '00 success; 04 invalid data (see errors map); 01 wrong hash; 98 merchant id not found; 104 merchant not enabled token flag.'
        message: { type: string }
        trace_id: { type: string }
      description: On code 04 the binding layer adds an `errors` object keyed by field name.
    data:
      type: object
      properties:
        deeplink:
          type: string
          description: ABA Mobile deeplink for linking.
        qr_string:
          type: string
          description: QR payload for linking.
        expire_in:
          description: QR/deeplink expiry (10 minutes per live docs).

LinkCardRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, token_flag, currency, hash]
  properties:
    request_id: { type: string, description: "5–24 chars, letters+digits only." }
    request_time: { type: string, description: "UTC timestamp, YYYYMMDDHHmmss." }
    merchant_id: { type: string }
    ctid: { type: string, description: "Customer token identifier. 5–24 chars, letters+digits only. Required per live docs." }
    token_flag:
      type: string
      enum: [CITI_FLEX, CITO_FLEX]
      description: Live docs list CITI_FLEX / CITO_FLEX for link-card.
    frequency:
      type: string
      enum: [1W, 1M, 2M]
      description: "Marked 'Required for Link Card' in live docs; the SDK warns when omitted (§16 realignment). Billing frequency."
    amount:
      type: string
      description: >
        Hash position ONLY (§16) — it participates in the HMAC (hashes as '')
        but has NO request body field. Listed here to document the quirk; do
        not send it.
    continue_success_url:
      type: string
      description: Base64-encoded URL — target of the hosted form's "Done" button.
    callback_url: { type: string, description: "Base64-encoded token pushback URL; defaults to the profile pushback_url." }
    currency: { type: string, enum: [KHR, USD], description: "Required per live docs (sandbox binds USD by default — §9a)." }
    hash: { type: string }

LinkCardResponse:
  type: object
  description: >
    The endpoint ALWAYS responds with an HTML page (render in an iframe),
    on success and on error alike — there is no JSON error envelope.

CofPaymentRequest:
  type: object
  required: [request_time, merchant_id, tran_id, amount, currency, ctid, pwt, token_flag, hash]
  properties:
    request_time: { type: string, description: "UTC timestamp, YYYYMMDDHHmmss." }
    merchant_id: { type: string }
    tran_id: { type: string, maxLength: 20, description: "Merchant-generated unique transaction identifier." }
    amount: { type: number, description: "Payment amount. Floor: KHR >= 100, USD >= 0.01." }
    pwt: { type: string, description: "PayWay token from link-account or link-card." }
    ctid: { type: string, maxLength: 24, description: "Customer token identifier." }
    first_name: { type: string, maxLength: 20 }
    last_name: { type: string, maxLength: 20 }
    email: { type: string, maxLength: 50 }
    phone: { type: string, maxLength: 20 }
    purchase_type:
      type: string
      enum: [purchase, pre-auth]
      default: purchase
    callback_url: { type: string, description: "Base64-encoded." }
    items: { type: string, maxLength: 500, description: "Base64-encoded JSON [{name,quantity,price}]." }
    return_params: { type: string, maxLength: 500 }
    payout: { type: string, maxLength: 500, description: "Base64-encoded JSON [{acc,amt}]." }
    custom_fields: { type: string, maxLength: 500, description: "Base64-encoded JSON." }
    token_flag:
      type: string
      enum: [CITU_FLEX, MITU_FLEX, MITR_FIX]
      description: Live-documented charging flags. Sandbox additionally accepted MITU_FIX / MITR_FLEX (§9b).
    shipping_fee: { type: number, description: "Shipping fee — 'can be any amount' per live docs." }
    currency: { type: string, enum: [KHR, USD] }
    hash: { type: string }

CofPaymentResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code:
          type: string
          description: '00 success; 04 invalid data (errors map); 01 wrong hash; 98 merchant id not found.'
        message: { type: string }
        tran_id: { type: string }
        trace_id: { type: string }
      description: On code 04 the binding layer adds an `errors` object keyed by field name.

RenewTokenRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, pwt, hash]
  description: >
    Account tokens only. Live-documented hash order: ctid, request_time,
    pwt, merchant_id, request_id (differs from every other CoF endpoint).
  properties:
    request_id: { type: string, description: "5–24 chars, letters+digits only." }
    request_time: { type: string }
    merchant_id: { type: string }
    ctid: { type: string, description: "5–24 chars, letters+digits only." }
    pwt: { type: string }
    hash: { type: string }

RenewTokenResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code:
          type: string
          description: '00 success (example also carries tran_id); 4 invalid data; 1 wrong hash; 98 merchant id not found; 105 invalid payment credential token.'
        message: { type: string }
        tran_id: { type: string }
        trace_id: { type: string }
    new_token: { type: string, description: "New payment token replacing the old one." }

GetTokenDetailsRequest:
  type: object
  required: [request_id, request_time, merchant_id, hash]
  description: >
    Per the live docs this endpoint takes ONLY request_time, merchant_id,
    and request_id — no ctid, no pwt. Hash order: merchant_id, request_time, request_id.
  properties:
    request_id: { type: string, description: "5–24 chars, letters+digits only — the original link/renew request_id." }
    request_time: { type: string }
    merchant_id: { type: string }
    hash: { type: string }

GetTokenDetailsResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code:
          type: string
          description: '00 success; 04 invalid data (errors map); 1 wrong hash; 98 merchant id not found; 104 data not found.'
        message: { type: string }
        trace_id: { type: string }
    data:
      type: object
      properties:
        source_of_fund: { type: string, description: "Masked account/card — last 4 visible." }
        type: { type: string, description: "Visa | MC | CUP | JCB | ABA ACCOUNT." }
        status: { type: integer, description: "0 removed, 1 active, 2 frozen." }
        expired_at: { type: string, description: "Token expiry (date-time)." }
        token_flag: { type: string, description: "CITI_FLEX | CITO_FLEX | CITR_FIX." }
        frequency: { type: string, description: "Empty for FLEX flags; 1W/1M/2M for CITR_FIX." }
        amount_limit_per_tran: { type: number, description: "= subscribed_amount for CITR_FIX." }
        ctid: { type: string }
        pwt: { type: string }
        subscribed_amount: { type: number, description: "Fixed recurring amount; 0 for FLEX flags." }
        currency: { type: string }

RemoveTokenRequest:
  type: object
  required: [request_time, merchant_id, ctid, pwt, hash]
  description: >
    Per the live docs the request carries request_time, merchant_id, ctid,
    and pwt — no request_id. Hash order: merchant_id, ctid, request_time, pwt.
  properties:
    request_time: { type: string }
    merchant_id: { type: string }
    ctid: { type: string }
    pwt: { type: string }
    hash: { type: string }

RemoveTokenResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code:
          type: string
          description: '00 success; 04 invalid data (errors map); 98 merchant id not found; 01 wrong hash.'
        message: { type: string }
        trace_id: { type: string }
