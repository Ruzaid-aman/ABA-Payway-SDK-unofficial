# Credentials on File — Schemas

LinkAccountRequest:
  type: object
  required: [request_id, request_time, merchant_id, hash]
  properties:
    request_id:
      type: string
      description: Unique request identifier generated by the merchant.
    request_time:
      type: string
      description: UTC timestamp, format YYYYMMDDHHmmss.
    merchant_id:
      type: string
      description: Merchant key issued by ABA Bank.
    ctid:
      type: string
      description: Customer token identifier — merchant-side unique ID for the customer.
    return_deeplink:
      type: string
      description: Base64-encoded JSON {ios_scheme, android_scheme} for mobile app integration.
    token_flag:
      type: string
      enum: [CITR_FIX, CITR_FLEX, MITR_FIX, MITR_FLEX, CITI_FIX, CITI_FLEX, MITU_FIX, MITU_FLEX]
      description: >
        Defines who triggers transactions and whether the amount is fixed or
        variable. CITR = Customer-Initiated Token Registration,
        MITR = Merchant-Initiated Token Registration.
    currency:
      type: string
      enum: [KHR, USD]
    callback_url:
      type: string
      description: URL where PayWay sends the account details and token after linking.
    hash:
      type: string
      description: base64(HMAC-SHA512(concat_in_x-hmac-fields-order, api_key)).

LinkAccountResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    qr_string:
      type: string
      description: QR code payload for scanning.
    abapay_deeplink:
      type: string
      description: Deeplink to open ABA Mobile.

LinkCardRequest:
  type: object
  required: [request_id, request_time, merchant_id, hash]
  properties:
    request_id: { type: string }
    request_time: { type: string, description: "UTC timestamp, YYYYMMDDHHmmss." }
    merchant_id: { type: string }
    ctid: { type: string, description: "Customer token identifier." }
    return_deeplink: { type: string }
    token_flag:
      type: string
      enum: [CITR_FIX, CITR_FLEX, MITR_FIX, MITR_FLEX, CITI_FIX, CITI_FLEX, MITU_FIX, MITU_FLEX]
    frequency:
      type: string
      enum: [1W, 1M, 2M]
      description: "Required for Link Card. Billing frequency."
    return_url: { type: string, description: "Base64-encoded callback URL." }
    callback_url: { type: string }
    hash: { type: string }

LinkCardResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

CofPaymentRequest:
  type: object
  required: [request_id, request_time, merchant_id, tran_id, amount, payment_token, hash]
  properties:
    request_id: { type: string }
    request_time: { type: string, description: "UTC timestamp, YYYYMMDDHHmmss." }
    merchant_id: { type: string }
    tran_id: { type: string, description: "Merchant-generated unique transaction identifier." }
    amount: { type: number, description: "Payment amount." }
    pwt: { type: string, description: "Token from link-account or link-card." }
    ctid: { type: string, description: "Customer token identifier." }
    token_flag:
      type: string
      enum: [CITR_FIX, CITR_FLEX, MITR_FIX, MITR_FLEX, CITI_FIX, CITI_FLEX, MITU_FIX, MITU_FLEX]
    currency: { type: string, enum: [KHR, USD] }
    callback_url: { type: string }
    hash: { type: string }

CofPaymentResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        tran_id: { type: string }

RenewTokenRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, pwt, hash]
  properties:
    request_id: { type: string }
    request_time: { type: string }
    merchant_id: { type: string }
    ctid: { type: string }
    pwt: { type: string }
    hash: { type: string }

RenewTokenResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    new_token: { type: string, description: "New payment token replacing the old one." }

GetTokenDetailsRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, pwt, hash]
  properties:
    request_id: { type: string }
    request_time: { type: string }
    merchant_id: { type: string }
    ctid: { type: string }
    pwt: { type: string }
    hash: { type: string }

GetTokenDetailsResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    data:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, description: "ACCOUNT or CARD." }
        masked_account: { type: string, description: "Masked account number or card PAN." }
        token_status: { type: string }
        expiry_date: { type: string }

RemoveTokenRequest:
  type: object
  required: [request_id, request_time, merchant_id, ctid, pwt, hash]
  properties:
    request_id: { type: string }
    request_time: { type: string }
    merchant_id: { type: string }
    ctid: { type: string }
    pwt: { type: string }
    hash: { type: string }

RemoveTokenResponse:
  type: object
  properties:
    status:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
