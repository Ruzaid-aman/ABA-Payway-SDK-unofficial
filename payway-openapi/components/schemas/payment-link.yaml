# Payment Link — Schemas

CreatePaymentLinkRequest:
  type: object
  required: [request_time, merchant_id, merchant_auth, hash]
  description: >
    Uses RSA-encrypted merchant_auth containing transaction details.
    See x-merchant-auth-encryption on the operation for encryption process.
    Sandbox-verified: currency and return_url are REQUIRED inside
    merchant_auth (PTL04 "Parameter validation required" when omitted).
    Sent as multipart/form-data. The HMAC hash covers
    request_time + merchant_id + merchant_auth ONLY — the optional
    image bytes are never hashed (per ABA's official PHP sample).
  properties:
    request_time:
      type: string
      description: UTC timestamp, YYYYMMDDHHmmss.
    merchant_id:
      type: string
      description: Merchant key issued by ABA Bank.
    merchant_auth:
      type: string
      description: >
        Base64 of RSA-encrypted, chunked JSON containing transaction
        details (title, amount, currency, description, payment_limit,
        return_url, merchant_ref_no, expired_date, payout).
    hash:
      type: string
      description: base64(HMAC-SHA512(request_time + merchant_id + merchant_auth, api_key)).
    payout:
      type: string
      description: >
        Optional split-payout instructions INSIDE the merchant_auth
        plaintext (JSON array "[{acc, amt}]" as a string value — the whole
        auth payload is JSON-encoded, so an array value would
        double-encode). Documented rule: the total payout amt must equal
        the link amount. Officially optional. Listed here as a top-level
        property so schema tooling can see it; the wire format is the
        merchant_auth plaintext shape (see x-merchant-auth-encryption).
    image:
      type: string
      format: binary
      description: >
        Optional image shown with the payment link (top-level multipart
        part, not part of the hash). The created PaymentLink echoes it
        back as the `image` object.

PaymentLink:
  type: object
  description: A payment link resource as returned by the create and detail endpoints (sandbox-verified shape).
  properties:
    id:
      type: string
      description: Payment link id used with the detail endpoint (e.g. "zX71gfZgVme0juZANHfZMA=="). NOT the slug in the payment_link URL.
    title: { type: string }
    image:
      type: object
      properties:
        image: { type: string }
        filename: { type: string }
        size: { type: integer }
    amount:
      type: string
      description: 'Amount as a string (e.g. "0.02").'
    currency:
      type: string
      enum: [USD, KHR]
    status:
      type: string
      description: Link status (e.g. OPEN).
    description: { type: string }
    payment_limit: { type: integer }
    total_amount_org:
      type: number
      description: "Total payment amount before refunds (official schema says string; observed numeric — do not rely on the type)."
    total_refund:
      type: number
      description: "Total refunded amount (official create schema: number; official detail schema: string — observed numeric; do not rely on the type)."
    total_amount:
      type: number
      description: Total amount after refunds.
    total_trxn:
      type: integer
      description: The total number of completed payment transactions (0 on create).
    created_at:
      type: string
      description: "YYYY-MM-DD HH:mm:ss"
    updated_at:
      type: string
      description: "YYYY-MM-DD HH:mm:ss"
    expired_date:
      oneOf: [{ type: integer }, { type: string }]
      description: Epoch seconds when set; empty string or "0" when unset.
    return_url:
      type: string
      description: Decoded callback URL.
    pushback_url:
      type: string
      description: >
        The URL the gateway calls to send payment status updates (detail
        endpoint; official detail schema — may mirror return_url).
    merchant_ref_no: { type: string }
    outlet_id: { type: string }
    outlet_name: { type: string }
    payout:
      oneOf:
        - type: object
        - type: array
        - type: 'null'
      description: >
        Payout details (null when none). PLACEMENT IS UNVERIFIED: the
        official apidog create schema places a top-level payout array of
        {acc, amt, acc_name}; the official overview sample response shows
        it inside data as an array. oneOf both shapes until probe V-2
        settles it (see HANDOFF §9 open items) — do not rely on either.
    payment_link:
      type: string
      description: Hosted checkout URL to share with customers (e.g. https://link-sandbox.payway.com.kh/ABAPAYzC80644N).

PaymentLinkStatus:
  type: object
  properties:
    code: { type: string }
    message: { type: string }
    tran_id: { type: string }
    lang: { type: string }
    trace_id: { type: string }

CreatePaymentLinkResponse:
  type: object
  properties:
    status:
      $ref: '#/PaymentLinkStatus'
    tran_id:
      description: >
        Gateway log id. Official schemas say string; the official overview
        sample shows an integer — coerce, do not rely on the type.
      oneOf: [{ type: integer }, { type: string }]
    data:
      $ref: '#/PaymentLink'

GetPaymentLinkDetailsRequest:
  type: object
  required: [request_time, merchant_id, merchant_auth, hash]
  properties:
    request_time: { type: string, description: "UTC timestamp, YYYYMMDDHHmmss." }
    merchant_id: { type: string }
    merchant_auth:
      type: string
      description: RSA-encrypted JSON {mc_id, id}.
    hash:
      type: string
      description: base64(HMAC-SHA512(request_time + merchant_id + merchant_auth, api_key)).

GetPaymentLinkDetailsResponse:
  type: object
  properties:
    status:
      $ref: '#/PaymentLinkStatus'
    tran_id:
      description: >
        Gateway log id. Official schemas say string; observed integer —
        coerce, do not rely on the type.
      oneOf: [{ type: integer }, { type: string }]
    data:
      $ref: '#/PaymentLink'
