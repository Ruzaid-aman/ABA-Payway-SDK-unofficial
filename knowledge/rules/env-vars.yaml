# PayWay environment variables — authored registry (audit P1-04 / P1-05,
# DX-KNOW-005 / DX-KNOW-005b — docs/project/2026-10-05-dx-platform-audit-pass2.md
# §47 and §29.2).
#
# This file is AUTHORED, not derived from code: which variables exist, what
# they mean, whether they are safe to commit, and what they default to is
# knowledge that spans the SDK, the CLI, the docs and ABA's own integration
# material — it is not reconstructible from `process.env` reads alone (§29:
# "the only way to make the set complete and testable").
#
# `npm run gen:env-vars` deterministically emits TWO artifacts from this file
# (`--check` exits 0 iff both committed artifacts are byte-identical to a
# fresh generation):
#   - src/generated/env-registry.ts  — typed module consumed by
#     src/config/envValidator.ts (the known-variable allow-list behind
#     W-PAYWAY-UNKNOWN-VAR), src/cli/commands/init.ts (.env.example), and
#     src/__tests__/env-registry-conformance.test.ts.
#   - .env.example (repo root) — the complete, grouped, commented variable
#     reference. `init` writes the same generated text into new projects.
#
# Never edit either artifact by hand — edit this file and regenerate.
# Every src/ `process.env.PAYWAY_*` / `env.PAYWAY_*` read MUST have an entry
# here; env-registry-conformance.test.ts enforces that with a source scan.
#
# Field notes:
#   name:       PAYWAY_[A-Z0-9_]+ — exactly the variable name.
#   kind:       secret     — must never be committed; .env.example carries a
#                          placeholder only (API keys, partner secret).
#               credential — account identifier or PUBLIC key; not secret but
#                          account-specific (merchant/partner IDs, RSA public
#                          key, Bakong/ABA KHQR identifiers).
#               non-secret — safe to commit in example configs.
#   group:      .env.example section order — connection, credentials, urls,
#               tls, behavior, data, integrations.
#   default:    null = unset (the consumer picks its built-in default, named
#               in the description). Secrets must have default: null.
#   required:   true = validatePayWayEnv reports a blocking error when the
#               variable is missing/empty.
#   consumedBy: repo-relative files that READ the variable (the conformance
#               test asserts each file exists and each non-external variable
#               has at least one reader).
#   external:   true = documented contract with NO in-repo reader yet (kept
#               registered so setting it never produces a false
#               "unrecognized variable" warning).
#   example:    optional placeholder value for .env.example when the default
#               is null (never a real credential).
#   docsAnchor: repo-relative doc that documents the variable.
schema: payway-env-vars/v1
owner: SDK maintainer
vars:
  # ------------------------------------------------------------------
  # Connection
  # ------------------------------------------------------------------
  - name: PAYWAY_ENV
    kind: non-secret
    group: connection
    description: >-
      Target environment: sandbox, production, or an https base URL (a URL
      value is honored as the API base URL and takes precedence over
      PAYWAY_SANDBOX).
    default: 'sandbox'
    required: true
    consumedBy:
      - src/client.ts
      - src/cli.ts
      - src/config/templates/express.ts
      - src/config/templates/nextApp.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  - name: PAYWAY_SANDBOX
    kind: non-secret
    group: connection
    description: >-
      Legacy environment switch for the SDK client: 'true' resolves the
      sandbox endpoint, 'false' resolves production. Ignored when PAYWAY_ENV
      is sandbox/production/a URL.
    default: 'true'
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  - name: PAYWAY_BASE_URL
    kind: non-secret
    group: connection
    description: >-
      Overrides the API base URL for the SDK client (highest-priority URL
      source after explicit constructor config). Useful for the ABA Mobile
      Simulator or a local mock.
    default: null
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: 'https://api-example.sandbox.payway.com.kh'

  - name: PAYWAY_TIMEOUT
    kind: non-secret
    group: connection
    description: >-
      Request timeout in milliseconds for SDK API calls (integer). Unset uses
      the SDK default of 30000 ms; non-positive or non-numeric values throw a
      PayWayConfigError.
    default: null
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: '30000'

  - name: PAYWAY_STRICT_VALIDATION
    kind: non-secret
    group: connection
    description: >-
      '1' or 'true' enables SDK strict local validation (tighter request
      checks before any network call).
    default: '0'
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  - name: PAYWAY_PROFILE
    kind: non-secret
    group: connection
    description: >-
      Selects the active CLI profile from the user profile store when no
      --profile flag is given (agent REPL, session shell, and top-level
      commands all honor it).
    default: null
    required: false
    consumedBy:
      - src/cli.ts
      - src/agent/context.ts
      - src/agent/repl.ts
      - src/cli/commands/agent.ts
      - src/cli/session.ts
    docsAnchor: docs/guides/AGENTIC-PAYWAY-CLI-USER-GUIDE.md

  # ------------------------------------------------------------------
  # Credentials
  # ------------------------------------------------------------------
  - name: PAYWAY_MERCHANT_ID
    kind: credential
    group: credentials
    description: >-
      ABA-issued merchant ID (MID) used to sign every merchant-authenticated
      API request. Required together with PAYWAY_API_KEY.
    default: null
    required: true
    consumedBy:
      - src/client.ts
      - src/cli.ts
      - src/config/templates/express.ts
      - src/config/templates/nextApp.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: 'ec476910'

  - name: PAYWAY_API_KEY
    kind: secret
    group: credentials
    description: >-
      ABA-issued merchant API key used for HMAC request signing and callback
      verification. Never commit a real value; .env is git-ignored.
    default: null
    required: true
    consumedBy:
      - src/client.ts
      - src/cli.ts
      - src/cli/commands/setup-webhook.ts
      - src/cli/commands/webhook.ts
      - src/config/templates/express.ts
      - src/config/templates/nextApp.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  - name: PAYWAY_RSA_PUBLIC_KEY
    kind: credential
    group: credentials
    description: >-
      ABA-issued RSA PUBLIC key (PEM). Required for refund, pre-auth,
      payout/beneficiary, payment-link and COF operations. Single-line values
      with literal \n escapes and multi-line quoted PEMs are both supported
      by the CLI .env loader.
    default: null
    required: false
    pemSyntax: true
    consumedBy:
      - src/client.ts
      - src/cli.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  - name: PAYWAY_PARTNER_ID
    kind: credential
    group: credentials
    description: >-
      Partner ID for merchant self-activation endpoints (requestWithPartnerAuth).
      A partner-only configuration can construct the SDK and call partner
      endpoints without merchant credentials.
    default: null
    required: false
    consumedBy:
      - src/client.ts
      - src/cli.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: 'partner-0001'

  - name: PAYWAY_PARTNER_API_KEY
    kind: secret
    group: credentials
    description: >-
      Partner API key for self-activation endpoints (SHA256 HMAC; the
      get-mc-credential-info leg uses SHA512). Never commit a real value.
    default: null
    required: false
    consumedBy:
      - src/client.ts
      - src/cli.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md

  # ------------------------------------------------------------------
  # URLs
  # ------------------------------------------------------------------
  - name: PAYWAY_RETURN_URL
    kind: non-secret
    group: urls
    description: >-
      Default customer return URL after checkout. Required when launching
      checkout (validatePayWayEnv reports a blocking error when missing);
      the CLI uses it as the fallback for the matching --return-url flag.
    default: null
    required: true
    consumedBy:
      - src/cli.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: 'https://yoursite.com/payment/return'

  - name: PAYWAY_CANCEL_URL
    kind: non-secret
    group: urls
    description: >-
      Customer cancel URL for hosted checkout. Must be an http(s) URL when
      set; the CLI uses it as the fallback for the matching --cancel-url flag.
    default: null
    required: false
    consumedBy:
      - src/cli.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/02-prerequisites-and-setup.md
    example: 'https://yoursite.com/payment/cancel'

  - name: PAYWAY_CALLBACK_URL
    kind: non-secret
    group: urls
    description: >-
      Server-to-server callback URL (transaction pushback, COF linking,
      webhook workbench). Must be publicly reachable; verify incoming
      callbacks with the X-PAYWAY-HMAC-SHA512 header.
    default: null
    required: false
    consumedBy:
      - src/cli.ts
      - src/cli/commands/setup-webhook.ts
      - src/cli/templates/first-payment/index.ts
      - src/config/envValidator.ts
    docsAnchor: docs/guides/11-callbacks-and-webhooks.md
    example: 'https://yoursite.com/api/payment/callback'

  # ------------------------------------------------------------------
  # TLS
  # ------------------------------------------------------------------
  - name: PAYWAY_TLS_CA_FILE
    kind: non-secret
    group: tls
    description: >-
      Path to a PEM CA bundle used to verify the PayWay endpoint certificate
      (DX-SEC-001: the safe replacement for the legacy TLS-verification bypass).
    default: null
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/13-deployment-checklist.md
    example: './certs/payway-sandbox-ca.pem'

  - name: PAYWAY_TLS_MIN_VERSION
    kind: non-secret
    group: tls
    description: >-
      Minimum TLS protocol version for SDK requests: TLSv1, TLSv1.1, TLSv1.2,
      or TLSv1.3. Anything else throws a PayWayConfigError.
    default: null
    required: false
    consumedBy:
      - src/client.ts
    docsAnchor: docs/guides/13-deployment-checklist.md
    example: 'TLSv1.2'

  # ------------------------------------------------------------------
  # Behavior toggles
  # ------------------------------------------------------------------
  - name: PAYWAY_UI
    kind: non-secret
    group: behavior
    description: >-
      CLI presentation mode: 'classic' forces the legacy plain output on real
      TTYs too; anything else auto-selects the interactive TUI (agents/CI and
      pipes always stay classic).
    default: 'auto'
    required: false
    consumedBy:
      - src/cli/ui/mode.ts
    docsAnchor: docs/guides/AGENTIC-PAYWAY-CLI-USER-GUIDE.md

  - name: PAYWAY_LOG_LEVEL
    kind: non-secret
    group: behavior
    description: >-
      SDK log level: debug, info, warn, or error. Unset resolves to info
      (debug when the legacy debug config/DEBUG_PAYWAY flag is set).
    default: 'info'
    required: false
    consumedBy:
      - src/logger.ts
    docsAnchor: docs/guides/12-error-handling-and-debugging.md

  - name: PAYWAY_NO_UPDATE_CHECK
    kind: non-secret
    group: behavior
    description: >-
      '1' disables the CLI's once-per-day update check (which only runs on
      interactive TTYs anyway).
    default: '0'
    required: false
    consumedBy:
      - src/cli/update-check.ts
    docsAnchor: docs/guides/AGENTIC-PAYWAY-CLI-USER-GUIDE.md

  - name: PAYWAY_ONBOARD_AUTO
    kind: non-secret
    group: behavior
    description: >-
      '1' launches the interactive onboarding wizard automatically on the
      first unconfigured CLI command (interactive TTYs only). Opt-in.
    default: '0'
    required: false
    consumedBy:
      - src/cli/commands/onboard.ts
    docsAnchor: docs/guides/AGENTIC-PAYWAY-CLI-USER-GUIDE.md

  - name: PAYWAY_MCP_ALLOW_MUTATIONS
    kind: non-secret
    group: behavior
    description: >-
      '1' registers the mutating MCP tools (the MCP server is read-only by
      default). Equivalent to the --allow-mutations CLI flag.
    default: '0'
    required: false
    consumedBy:
      - src/mcp/server.ts
    docsAnchor: docs/guides/AGENTIC-PAYWAY-CLI-USER-GUIDE.md

  - name: PAYWAY_AGENT_NO_RECOVER_HINT
    kind: non-secret
    group: behavior
    description: >-
      Set to suppress the agent REPL's recovery hint when the inference
      provider fails to propose a plan.
    default: null
    required: false
    consumedBy:
      - src/agent/repl.ts
    docsAnchor: docs/guides/24-agent-integration.md

  - name: PAYWAY_JOURNAL
    kind: non-secret
    group: behavior
    description: >-
      Journal recording switch. SDK library: opt-in ('1'/'true'/'yes'/'on').
      CLI: API commands record by default; PAYWAY_JOURNAL=0 (or --no-journal)
      opts out.
    default: null
    required: false
    consumedBy:
      - src/journal/writer.ts
    docsAnchor: docs/guides/18-transaction-journal.md

  - name: PAYWAY_JOURNAL_MODE
    kind: non-secret
    group: behavior
    description: >-
      Journal record detail: 'digest' (default — non-secret fields only) or
      'full' (complete payloads; never journal secrets).
    default: 'digest'
    required: false
    consumedBy:
      - src/journal/writer.ts
    docsAnchor: docs/guides/18-transaction-journal.md

  - name: PAYWAY_JOURNAL_MAX_AGE_DAYS
    kind: non-secret
    group: behavior
    description: >-
      Retention guard: journal events older than this many days are pruned on
      write (best-effort, never blocks the emitting call). Unset disables
      age-based pruning.
    default: null
    required: false
    consumedBy:
      - src/journal/writer.ts
    docsAnchor: docs/guides/18-transaction-journal.md
    example: '90'

  - name: PAYWAY_FORCE_JSON_STORAGE
    kind: non-secret
    group: behavior
    description: >-
      '1' forces the JSON file storage backend even when better-sqlite3 is
      importable (the SQLite default is one shared <data root>/payway.db).
    default: '0'
    required: false
    consumedBy:
      - src/storage/storage-service.ts
    docsAnchor: docs/guides/21-storage-service.md

  # ------------------------------------------------------------------
  # Data directories
  # ------------------------------------------------------------------
  - name: PAYWAY_DATA_DIR
    kind: non-secret
    group: data
    description: >-
      Overrides the shared data root for every local store (journal.jsonl,
      linked-tokens.json, webhook_data/, payway.db). Default:
      <APPDATA|~/.config>/aba-payway-sdk/data.
    default: null
    required: false
    consumedBy:
      - src/config/data-root.ts
    docsAnchor: docs/guides/21-storage-service.md

  - name: PAYWAY_JOURNAL_DIR
    kind: non-secret
    group: data
    description: >-
      Journal directory override (default: the PAYWAY_DATA_DIR data root).
      Precedence: explicit --dir arg > this variable > the data root.
    default: null
    required: false
    consumedBy:
      - src/journal/writer.ts
      - src/mcp/extras.ts
    docsAnchor: docs/guides/18-transaction-journal.md

  - name: PAYWAY_WEBHOOK_DIR
    kind: non-secret
    group: data
    description: >-
      Webhook capture directory override (default: <data root>/webhook_data).
      The webhook workbench stores signed captures here for resend/verify.
    default: null
    required: false
    consumedBy:
      - src/config/data-root.ts
    docsAnchor: docs/guides/16-webhook-setup-guide.md

  - name: PAYWAY_TOKEN_STORE_DIR
    kind: non-secret
    group: data
    description: >-
      COF linked-token store directory override (default: the PAYWAY_DATA_DIR
      data root; tokens live in linked-tokens.json).
    default: null
    required: false
    consumedBy:
      - src/webhook/token-store.ts
    docsAnchor: docs/guides/21-storage-service.md

  - name: PAYWAY_KNOWLEDGE_DIR
    kind: non-secret
    group: data
    description: >-
      Overrides the knowledge-base directory (the packaged knowledge/ corpus
      with MANIFEST.json). Default resolves relative to the executable, then
      ./knowledge from the working directory.
    default: null
    required: false
    consumedBy:
      - src/knowledge/store.ts

  # ------------------------------------------------------------------
  # Integrations
  # ------------------------------------------------------------------
  - name: PAYWAY_AGENT_API_KEY
    kind: secret
    group: integrations
    description: >-
      Inference-provider API key for the agent REPL (`payway-sdk agent`). The
      CLI never stores, logs, or accepts this key as an argument — it is read
      from the environment only and redacted from all agent output.
    default: null
    required: false
    consumedBy:
      - src/agent/onboarding/scan.ts
      - src/agent/onboarding/stages.ts
      - src/agent/orchestrator.ts
      - src/agent/provider.ts
    docsAnchor: docs/guides/24-agent-integration.md

  - name: PAYWAY_AGENT_BASE_URL
    kind: non-secret
    group: integrations
    description: >-
      Base URL for the agent REPL's inference provider (documented contract
      for self-hosted/proxied OpenAI-compatible endpoints; the in-repo
      provider adapter currently receives baseUrl via its config object, so
      no direct process.env read exists — registered so setting it is never
      reported as unrecognized).
    default: null
    required: false
    consumedBy: []
    external: true
    docsAnchor: docs/guides/24-agent-integration.md

  - name: PAYWAY_KHQR_BAKONG_ID
    kind: credential
    group: integrations
    description: >-
      Bakong account ID (user@bakong) for ABA KHQR generation — part of the
      nested merchant-account template (max 32 UTF-8 bytes).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: 'merchant@bakong'

  - name: PAYWAY_KHQR_ABA_MERCHANT_ID
    kind: credential
    group: integrations
    description: >-
      ABA merchant ID embedded in the KHQR merchant-account template (exactly
      15 digits).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: '000000000000000'

  - name: PAYWAY_KHQR_ACQUIRER_NAME
    kind: non-secret
    group: integrations
    description: >-
      Acquirer name for the KHQR merchant-account template (max 32 UTF-8
      bytes).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: 'ABA Bank'

  - name: PAYWAY_KHQR_MERCHANT_CATEGORY_CODE
    kind: non-secret
    group: integrations
    description: >-
      KHQR merchant category code (exactly 4 digits, ISO 18245).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: '5999'

  - name: PAYWAY_KHQR_MERCHANT_NAME
    kind: non-secret
    group: integrations
    description: >-
      KHQR merchant name (max 25 characters).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: 'My Shop'

  - name: PAYWAY_KHQR_MERCHANT_CITY
    kind: non-secret
    group: integrations
    description: >-
      KHQR merchant city (max 15 characters).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
    example: 'Phnom Penh'

  - name: PAYWAY_KHQR_PAYWAY_DATA
    kind: non-secret
    group: integrations
    description: >-
      ABA PayWay template string embedded in KHQR tag 62 (max 99 UTF-8 bytes;
      must leave room for a 25-byte merchant reference).
    default: null
    required: false
    consumedBy:
      - src/khqr-config.ts
    docsAnchor: docs/guides/07-qr-code-handling.md
