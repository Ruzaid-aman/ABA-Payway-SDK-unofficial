<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Integration Example</title>
  <style>
    
    /* Modal styles for mobile */
    #paymentModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }   
    #paymentModal iframe {
      width: 100%;
      max-width: 960px;
      height: 690px;
      margin: 20px;

      border: none;
      border-radius: 8px;
      background: #fff;
    }
    #closeModal {
      position: absolute;
      top: 10px; right: 20px;
      font-size: 2em;
      color: #fff;
      cursor: pointer;
      z-index: 10000;
    }
     @media screen and (max-width: 910px) {
      #paymentModal iframe {
        width: 345px;
        height: 590px;
      }
    }
  </style>
</head>
<body>
  <button id="payBtn">Pay Now</button>

  <!-- Modal for mobile -->
  <div id="paymentModal">
    <span id="closeModal">&times;</span>
    <iframe id="paymentIframe" src=""></iframe>
  </div>

  <script>
    
    //Use paymentKHQRLink return from the API in Step 1.

    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    document.getElementById('payBtn').onclick = function() {
      if (isMobile()) {
        // Mobile: Show iframe modal
        document.getElementById('paymentIframe').src = paymentKHQRLink;
        document.getElementById('paymentModal').style.display = 'flex';
      } else {
        // Desktop: Open pop-up window
        window.open(paymentKHQRLink, 'PaymentWindow', 'width=500,height=700');
      }
    };

    document.getElementById('closeModal').onclick = function() {
      document.getElementById('paymentModal').style.display = 'none';
      document.getElementById('paymentIframe').src = '';
    };
  </script>
</body>
</html>
