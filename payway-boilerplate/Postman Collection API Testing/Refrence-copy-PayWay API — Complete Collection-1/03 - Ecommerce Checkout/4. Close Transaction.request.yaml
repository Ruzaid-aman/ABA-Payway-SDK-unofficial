$kind: http-request
description: |-
  ## ⚡ Quick test
  1. **Send** — closes/voids the transaction in `{{last_tran_id}}` (e.g. an unpaid pending purchase).
  2. Expect `status.code "00"`. A fresh/unknown id returns business code `5` (Transaction not found) — correct behaviour, not a bug.

  **Hash:** `req_time + merchant_id + tran_id`
url: "{{baseUrl}}/api/payment-gateway/v1/payments/close-transaction"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "req_time": "{{req_time}}",
      "merchant_id": "{{merchant_id}}",
      "tran_id": "{{tran_id}}",
      "hash": "{{computed_hash}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      // Close Transaction - hash: req_time+merchant_id+tran_id
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var tranId = C.get('last_tran_id') || C.get('tran_id');
      if (!tranId) throw new Error('No tran_id - run Purchase first or set {{tran_id}}.');
      var msg = reqTime + C.get('merchant_id') + tranId;
      C.set('req_time', reqTime);
      C.set('tran_id', tranId);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      var j = {};
      try { j = pm.response.json(); } catch (e) {}
      var sc = respCode(j);
      if (sc) pm.test('Close responded (status.code ' + sc + ')', function () { pm.expect(sc).to.not.be.empty; });
      console.log('status.code:', sc, '-', j.status && j.status.message);
    language: text/javascript
order: 4000
