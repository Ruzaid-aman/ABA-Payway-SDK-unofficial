scripts:
  - type: http:beforeRequest
    code: |-
      // ─── ONE-TIME RSA SETUP ───────────────────────────────────────────────────────
      // Runs before the first request of each session. Detects which RSA crypto backend
      // is available and, if node-forge is missing, fetches jsrsasign from CDN once and
      // caches its source in __rsaLibSrc so openSslEncrypt() can use it automatically.
      // Subsequent requests skip this block entirely (guard: __crypto_ready === 'true').
      if (pm.collectionVariables.get('__crypto_ready') !== 'true') {
        var _f = null;
        try { _f = require('node-forge'); } catch(e) {}
        if (!_f) { try { _f = require('forge'); } catch(e) {} }

        if (_f) {
          pm.collectionVariables.set('__crypto_backend', 'node-forge');
          pm.collectionVariables.set('__crypto_ready',  'true');
          console.log('[Setup] ✅ RSA backend: node-forge');
        } else {
          var _src = pm.collectionVariables.get('__rsaLibSrc') || '';
          if (_src.length > 5000) {
            // Already cached from a previous run that was saved
            pm.collectionVariables.set('__crypto_backend', 'jsrsasign');
            pm.collectionVariables.set('__crypto_ready',  'true');
            console.log('[Setup] ✅ RSA backend: jsrsasign (cached in __rsaLibSrc)');
          } else {
            // First time: fetch jsrsasign from CDN and cache it
            console.log('[Setup] ⏳ node-forge unavailable — fetching jsrsasign from CDN (one-time)...');
            pm.sendRequest(
              'https://cdn.jsdelivr.net/npm/jsrsasign@10.9.0/lib/jsrsasign-all-min.js',
              function(err, res) {
                if (err || !res || res.code !== 200) {
                  console.error('[Setup] ❌ jsrsasign CDN fetch failed:', err ? err.message : 'HTTP ' + (res && res.code));
                  console.error('[Setup]    RSA vars (e.g. {{pl_merchant_auth}}) must be set manually this run.');
                  return;
                }
                pm.collectionVariables.set('__rsaLibSrc',       res.text());
                pm.collectionVariables.set('__crypto_backend', 'jsrsasign');
                pm.collectionVariables.set('__crypto_ready',   'true');
                console.log('[Setup] ✅ jsrsasign ready (' + Math.round(res.text().length / 1024) + ' KB). Cached in __rsaLibSrc for future runs.');
              }
            );
          }
        }
      }
      // ─────────────────────────────────────────────────────────────────────────────

      // ─── PayWay helper library (restored into this script's own scope) ────────────
      // Postman executes every script (collection / folder / request-level, pre-request
      // and test) in its OWN scope: functions declared in one script are NOT visible in
      // another. The library therefore ships as the `__helpers` collection variable and
      // every script that needs the helpers starts by evaluating it.
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Global test: log status.code if the response is JSON
      if (pm.response && pm.response.headers && pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').toLowerCase().indexOf('json') >= 0) {
        try {
          var j = pm.response.json();
          if (j.status) console.log('Response status.code:', j.status.code, '-', j.status.message);
        } catch (e) {}
      }
    language: text/javascript
