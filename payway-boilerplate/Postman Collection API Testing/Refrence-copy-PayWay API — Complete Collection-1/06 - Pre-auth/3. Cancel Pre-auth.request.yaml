$kind: http-request
description: |-
  ## ⚡ Quick test
  1. Releases the hold from a `pre-auth` purchase (reads `{{last_tran_id}}`) — funds return to the cardholder.
  2. RSA needed (node-forge or `{{cancel_preauth_merchant_auth}}`).

  ## Cancel Pre-auth
  RSA payload: `{ "mc_id": "...", "tran_id": "..." }`
  Hash: `merchant_id + merchant_auth + request_time` (merchant_id FIRST).
  Without node-forge, set `{{cancel_preauth_merchant_auth}}`.
url: "{{baseUrl}}/api/merchant-portal/merchant-access/online-transaction/pre-auth-cancellation"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "request_time": "{{request_time}}",
      "merchant_id": "{{merchant_id}}",
      "merchant_auth": "{{computed_merchant_auth}}",
      "hash": "{{computed_hash}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      // Cancel Pre-auth - RSA({mc_id,tran_id}); hash: merchant_id+merchant_auth+request_time
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var payload = { mc_id: C.get('merchant_id'), tran_id: C.get('last_tran_id') || C.get('tran_id') || genTranId() };
      var auth = rsaFallback(JSON.stringify(payload), C.get('rsa_public_key'), 'cancel_preauth_merchant_auth');
      var msg = C.get('merchant_id') + auth + reqTime;
      C.set('request_time', reqTime);
      C.set('computed_merchant_auth', auth);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('RSA payload:', JSON.stringify(payload));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      var j = {};
      try { j = pm.response.json(); } catch (e) {}
      if (rsaMissing(j)) {
        pm.test('SKIPPED - RSA payload not configured', function () { pm.expect(true).to.eql(true); });
        console.log('SKIPPED: the gateway needs an RSA-encrypted merchant_auth. Install the node-forge library (collection > Libraries) or paste a pre-computed value into the fallback variable - see the request description.');
      } else {
        var code = j.statusCode || (j.status && j.status.code);
        pm.test('Cancel Pre-auth responded (status ' + String(code) + ')', function () { pm.expect(String(code)).to.not.be.undefined; });
        if (String(code) === '0' || String(code) === '00') { console.log('Pre-auth released.'); }
        else { console.log('status:', String(code), '-', (j.status && j.status.message) || j.message || ''); }
      }
    language: text/javascript
order: 3000
