$kind: http-request
description: |-
  ## ⚡ Quick test
  1. Set `{{whitelist_payee}}` to the payee's account number and **Send** — it becomes payout-eligible (request 1).
  2. RSA needed (node-forge or `{{add_whitelist_merchant_auth}}`).

  ## Add Account to Payout Whitelist
  RSA payload: `{ "mc_id": "...", "payee": "..." }`
  Hash: `request_time + merchant_auth` (NO merchant_id).
  Without node-forge, set `{{add_whitelist_merchant_auth}}`.
url: "{{baseUrl}}/api/merchant-portal/merchant-access/whitelist-account/add-whitelist-payout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "request_time": "{{request_time}}",
      "merchant_id": "{{merchant_id}}",
      "merchant_auth": "{{computed_merchant_auth}}",
      "hash": "{{computed_hash}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      // Add whitelist - RSA({mc_id,payee}); hash: request_time+merchant_auth
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var payload = { mc_id: C.get('merchant_id'), payee: C.get('whitelist_payee') };
      var auth = rsaFallback(JSON.stringify(payload), C.get('rsa_public_key'), 'add_whitelist_merchant_auth');
      var msg = reqTime + auth;
      C.set('request_time', reqTime);
      C.set('computed_merchant_auth', auth);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('RSA payload:', JSON.stringify(payload));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      var j = {};
      try { j = pm.response.json(); } catch (e) {}
      if (rsaMissing(j)) {
        pm.test('SKIPPED - RSA payload not configured', function () { pm.expect(true).to.eql(true); });
        console.log('SKIPPED: the gateway needs an RSA-encrypted merchant_auth. Install the node-forge library (collection > Libraries) or paste a pre-computed value into the fallback variable - see the request description.');
      } else {
        var code = j.statusCode || (j.status && j.status.code);
        pm.test('Add Account to Payout Whitelist responded (status ' + String(code) + ')', function () { pm.expect(String(code)).to.not.be.undefined; });
        if (String(code) === '0' || String(code) === '00') { console.log('Payee whitelisted.'); }
        else { console.log('status:', String(code), '-', (j.status && j.status.message) || j.message || ''); }
      }
    language: text/javascript
order: 2000
