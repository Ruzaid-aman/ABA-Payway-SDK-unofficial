$kind: http-request
description: |-
  ## ⚡ Quick test
  1. Set `{{merchant_ref}}` and **Send**. On the sandbox demo profile expect **404/empty** (informational — KHQR retrieval needs a dedicated `…instore` merchant profile); the path, hash and limits are docs-verified.

  ## KHQR guideline
  Use a dedicated **ABA KHQR** merchant account (merchant_id ending in `instore`). When the QR is scanned the payer enters amount/note (or the QR-data is pre-filled from `qr_data`); the `merchant_ref` lets you map the inbound transaction.

  Hash: `req_time + merchant_id + merchant_ref`

  Returns the last 50 transactions for that merchant_ref (10 req/min).

  > **Sandbox note (2026-09):** demo profiles returned HTTP 404 with an empty body for this endpoint - KHQR retrieval appears to require the dedicated KHQR merchant profile. The path, hash order and limits here are docs-verified.
url: "{{baseUrl}}/api/payment-gateway/v1/payments/get-transactions-by-mc-ref"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "req_time":     "{{req_time}}",
      "merchant_id":  "{{merchant_id}}",
      "merchant_ref": "{{merchant_ref}}",
      "hash":         "{{computed_hash}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      // get-transactions-by-mc-ref - hash: req_time+merchant_id+merchant_ref
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var msg = reqTime + C.get('merchant_id') + C.get('merchant_ref');
      C.set('req_time', reqTime);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      var j = null;
      try { j = pm.response.json(); } catch (e) {}
      if (pm.response.code === 404 || j === null) {
        pm.test('KHQR lookup responded (404/empty - see note)', function () { pm.expect(true).to.eql(true); });
        console.log('Sandbox note: demo profiles may not have KHQR retrieval provisioned (observed HTTP 404 with empty body). The path + hash (req_time+merchant_id+merchant_ref) are docs-verified; max 10 req/min, last 50 transactions.');
      } else {
        var sc = respCode(j);
        pm.test('KHQR lookup responded (status.code ' + sc + ')', function () { pm.expect(sc).to.not.be.empty; });
        console.log('status.code:', sc, '-', j.status && j.status.message);
      }
    language: text/javascript
order: 1000
