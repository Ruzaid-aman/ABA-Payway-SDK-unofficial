$kind: http-request
description: |-
  ## ⚡ Quick test
  1. Just hit **Send** — creates a recurring `CITR_FIX` subscription and returns the first-payment QR (Visualize tab); pay it to activate the token via callback.
  2. Tune with `{{sub_frequency}}` (1W/1M/2M), `{{sub_lifetime}}`, `{{sub_payment_option}}`.

  CITR_FIX subscription - uses the **v1 payments/purchase** hash (PayWay demo order):
  req_time+merchant_id+tran_id+amount+**items_b64**+''+shipping+**ctid**+''+firstname+lastname+email+phone+**type**+**payment_option**+return_url_b64+cancel_url_b64+continue_success_url_b64+return_deeplink_b64+currency+**custom_fields**+return_params+payout+lifetime+skip_success+token_flag+frequency

  Frequency: 1W | 1M | 2M. Set {{sub_lifetime}}, {{sub_payment_option}}, {{items_b64}} etc.
  Response opens a hosted page to approve the subscription.
url: "{{baseUrl}}/api/payment-gateway/v1/payments/purchase"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: req_time
      value: "{{request_time}}"
    - type: text
      key: merchant_id
      value: "{{merchant_id}}"
    - type: text
      key: tran_id
      value: "{{tran_id}}"
    - type: text
      key: firstname
      value: "{{sub_firstname}}"
    - type: text
      key: lastname
      value: "{{sub_lastname}}"
    - type: text
      key: email
      value: "{{sub_email}}"
    - type: text
      key: phone
      value: "{{sub_phone}}"
    - type: text
      key: type
      value: purchase
    - type: text
      key: payment_option
      value: "{{sub_payment_option}}"
    - type: text
      key: items
      value: "{{sub_items_b64}}"
    - type: text
      key: shipping
      value: "0"
    - type: text
      key: amount
      value: "{{sub_amount_fmt}}"
    - type: text
      key: return_url
      value: "{{sub_ret_b64}}"
    - type: text
      key: cancel_url
      value: "{{sub_can_b64}}"
    - type: text
      key: continue_success_url
      value: "{{sub_con_b64}}"
    - type: text
      key: return_deeplink
      value: ""
    - type: text
      key: currency
      value: "{{currency}}"
    - type: text
      key: custom_fields
      value: ""
    - type: text
      key: return_params
      value: ""
    - type: text
      key: payout
      value: ""
    - type: text
      key: lifetime
      value: "{{sub_lifetime}}"
    - type: text
      key: skip_success_page
      value: ""
    - type: text
      key: ctid
      value: "{{ctid}}"
    - type: text
      key: token_flag
      value: CITR_FIX
    - type: text
      key: frequency
      value: "{{sub_frequency}}"
    - type: text
      key: hash
      value: "{{computed_hash}}"
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      // Subscription - v1 purchase hash order (see description)
      var C = pm.collectionVariables;
      var itemRaw = (C.get('items_json') || '').trim() || '[{"name":"Subscription","quantity":1,"price":0.10}]';
      var itemsB64 = b64json(itemRaw);
      var ru = ensureB64(C.get('return_url') || 'https://example.com/return');
      var cu = ensureB64(C.get('cancel_url') || 'https://example.com/cancel');
      var su = ensureB64(C.get('continue_success_url') || 'https://example.com/success');
      var reqTime = utcNow();
      var tranId = genTranId();
      var amount = fmtAmt(C.get('amount'), C.get('currency'));
      var tokenFlag = 'CITR_FIX';
      var frequency = C.get('sub_frequency') || '1W';
      var lifetime = C.get('sub_lifetime') || '30';
      var msg = reqTime + C.get('merchant_id') + tranId + amount + itemsB64 + '' + '0'
        + C.get('ctid') + '' + C.get('sub_firstname') + C.get('sub_lastname') + C.get('sub_email') + C.get('sub_phone')
        + 'purchase' + (C.get('sub_payment_option') || 'abapay') + ru + cu + su + ''
        + (C.get('currency') || 'USD') + '' + '' + '' + lifetime + '' + tokenFlag + frequency;
      C.set('request_time', reqTime);
      C.set('tran_id', tranId);
      C.set('sub_amount_fmt', amount);
      C.set('sub_items_b64', itemsB64);
      C.set('sub_ret_b64', ru);
      C.set('sub_can_b64', cu);
      C.set('sub_con_b64', su);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The `__helpers` collection variable is missing - re-import the full collection JSON (it holds the shared helper library source).');
      eval(__h);
      var j = {};
      try { j = pm.response.json(); } catch (e) {}
      if (okStatus(j)) {
        pm.collectionVariables.set('last_tran_id', pm.collectionVariables.get('tran_id'));
        pm.test('Subscription purchase accepted (status.code 0/00)', function () { pm.expect(okStatus(j)).to.eql(true); });
        if (j.qrString) console.log('qrString:', String(j.qrString).slice(0, 48) + '... (first subscription payment QR - pay it to receive the token via callback)');
      } else if (j.status) {
        console.log('Subscription business error', j.status.code, '-', j.status.message);
      }
      var vj = {}; try { vj = pm.response.json(); } catch (e) {}
      if (vj.qrImage || vj.qrString) visualizeQr(vj.qrImage, vj.qrString, 'Subscription first payment - scan with the ABA Mobile app (sandbox). tran_id: ' + pm.collectionVariables.get('tran_id'));
    language: text/javascript
order: 7000
