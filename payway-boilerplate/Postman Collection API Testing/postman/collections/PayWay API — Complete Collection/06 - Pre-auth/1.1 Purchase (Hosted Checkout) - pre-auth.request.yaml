$kind: http-request
description: |-
  ## ⚡ Quick test

  1. Just hit **Send** — the sandbox merchant is pre-filled, nothing to configure.
      
  2. Success = **HTTP 200 HTML** (the hosted checkout page). A JSON `status` body = business error — check `b4hash:` in the Console first.
      
  3. Open the **Visualize** tab → click **Open payment page →** → pay with a sandbox test card (folder 01).
      
  4. Then send **3\. Check Transaction** — the tran_id was auto-saved to `{{last_tran_id}}`.
      

  **Tune:** `{{amount}}` (USD 2 decimals / KHR integer), `{{currency}}`, `{{payment_option}}`, buyer fields — all collection variables.  
  **Hash order:** req_time, merchant_id, tran_id, amount, items, shipping, first/last name, email, phone, type, payment_option, return_url, cancel_url, continue_success_url, return_deeplink, currency, custom_fields, return_params, payout, lifetime, additional_params, google_pay_token, skip_success_page.
url: "{{baseUrl}}/api/payment-gateway/v1/payments/purchase"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: req_time
      value: "{{req_time}}"
    - type: text
      key: merchant_id
      value: "{{merchant_id}}"
    - type: text
      key: tran_id
      value: "{{tran_id}}"
    - type: text
      key: firstname
      value: "{{buyer_first_name}}"
    - type: text
      key: lastname
      value: "{{buyer_last_name}}"
    - type: text
      key: email
      value: "{{buyer_email}}"
    - type: text
      key: phone
      value: "{{buyer_phone}}"
    - type: text
      key: type
      value: "{{purchase_type}}"
    - type: text
      key: payment_option
      value: "{{payment_option}}"
    - type: text
      key: items
      value: "{{items_b64}}"
      description: base64 of items JSON (auto)
    - type: text
      key: shipping
      value: "{{shipping}}"
    - type: text
      key: amount
      value: "{{amount}}"
    - type: text
      key: return_url
      value: "{{return_url_b64}}"
    - type: text
      key: continue_success_url
      value: "{{continue_success_url_b64}}"
    - type: text
      key: return_params
      value: "{{return_params}}"
    - type: text
      key: view_type
      value: "{{view_type}}"
    - type: text
      key: payment_gate
      value: "{{payment_gate}}"
    - type: text
      key: custom_fields
      value: "{{custom_fields_b64}}"
    - type: text
      key: payout
      value: "{{payout_b64}}"
    - type: text
      key: additional_params
      value: "{{additional_params_b64}}"
    - type: text
      key: google_pay_token
      value: "{{google_pay_token}}"
    - type: text
      key: skip_success_page
      value: "{{skip_success_page}}"
    - type: text
      key: lifetime
      value: "{{lifetime}}"
    - type: text
      key: currency
      value: "{{currency}}"
    - type: text
      key: cancel_url
      value: "{{cancel_url_b64}}"
    - type: text
      key: return_deeplink
      value: "{{return_deeplink_b64}}"
    - type: text
      key: hash
      value: "{{computed_hash}}"
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers_v20260923_portable_v2') || pm.collectionVariables.get('__helpers_v20260923_portable') || pm.collectionVariables.get('__helpers_v20260923') || pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The shared PayWay helper is missing. Re-import the complete collection.');
      eval(__h);
      // Purchase - hash order:
      // req_time, merchant_id, tran_id, amount, items, shipping, firstname, lastname, email, phone, type, payment_option,
      // return_url, cancel_url, continue_success_url, return_deeplink, currency, custom_fields, return_params, payout,
      // lifetime, additional_params, google_pay_token, skip_success_page
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var tranId = genTranId();
      var amount = fmtAmt(C.get('amount'), C.get('currency'));
      var itemRaw = (C.get('items_json') || '').trim() || '[{"name":"Test Item","quantity":1,"price":0.10}]';
      var itemsB64 = b64json(itemRaw);
      var customB64 = b64json((C.get('custom_fields_json')||'').trim());
      var payoutB64 = b64json((C.get('payout_json')||'').trim());
      var addB64 = b64json((C.get('additional_params_json')||'').trim());
      var rurl = ensureB64(C.get('return_url'));
      var curl = ensureB64(C.get('cancel_url'));
      var csurl = ensureB64(C.get('continue_success_url'));
      var rdl = b64json((C.get('return_deeplink_raw')||'').trim());
      var rparams = (C.get('return_params_raw')||'').trim();
      var msg = reqTime + C.get('merchant_id') + tranId + amount + itemsB64 + fmtAmt(C.get('shipping_fee'), C.get('currency'))
        + C.get('buyer_first_name') + C.get('buyer_last_name') + C.get('buyer_email') + C.get('buyer_phone')
        + C.get('purchase_type') + C.get('payment_option') + rurl + curl + csurl + rdl + C.get('currency')
        + customB64 + rparams + payoutB64 + C.get('lifetime') + addB64 + C.get('google_pay_token') + (C.get('skip_success_page')||'0');
      C.set('req_time', reqTime);
      C.set('tran_id', tranId);
      C.set('amount', amount);
      C.set('items_b64', itemsB64);
      C.set('shipping', fmtAmt(C.get('shipping_fee'), C.get('currency')));
      C.set('return_url_b64', rurl);
      C.set('cancel_url_b64', curl);
      C.set('continue_success_url_b64', csurl);
      C.set('return_deeplink_b64', rdl);
      C.set('custom_fields_b64', customB64);
      C.set('payout_b64', payoutB64);
      C.set('additional_params_b64', addB64);
      C.set('return_params', rparams);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers_v20260923_portable_v2') || pm.collectionVariables.get('__helpers_v20260923_portable') || pm.collectionVariables.get('__helpers_v20260923') || pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The shared PayWay helper is missing. Re-import the complete collection.');
      eval(__h);
      var ct = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      if (pm.response.code === 200 && ct.indexOf('html') >= 0) {
        // Hosted checkout flow: success = the checkout PAGE (HTML). Save tran_id for polling/refund.
        pm.collectionVariables.set('last_tran_id', pm.collectionVariables.get('tran_id'));
        pm.test('Purchase accepted - checkout page returned (HTML 200)', function () { pm.expect(pm.response.code).to.eql(200); });
      console.log('NEXT: open the Visualize tab -> "Open payment page" -> pay with a sandbox card (folder 01), then send 3. Check Transaction.');
        // Merchant-style launcher: form-POST the signed fields so the checkout page is
        // SERVED BY PayWay (its own origin) - saved .html opened from disk CORS-fails.
        var fields = {};
        if (pm.request.body && pm.request.body.formdata) {
          pm.request.body.formdata.each(function (p) { if (!p.disabled) fields[p.key] = pm.variables.replaceIn(String(p.value)); });
        }
        visualizeFormPost(pm.variables.replaceIn(pm.request.url.toString()), fields, 'PayWay hosted checkout',
          'How real integrations open PayWay: a form POST with these signed fields. Click the button - the checkout page is served by PayWay itself (no CORS issues). Pay with the sandbox test cards, then re-send Check Transaction here to see APPROVED.');
      } else {
        var j = {};
        try { j = pm.response.json(); } catch (e) {}
        if (okStatus(j)) {
          pm.collectionVariables.set('last_tran_id', pm.collectionVariables.get('tran_id'));
          pm.test('Purchase accepted (status.code 0)', function () { pm.expect(okStatus(j)).to.eql(true); });
      console.log('NEXT: tran_id saved to {{last_tran_id}} - verify with 3. Check Transaction.');
        } else if (j.status) {
          console.log('Purchase business error', j.status.code, '-', j.status.message);
          console.log('Compare b4hash (Postman Console) with the docs order; see the error-code table in the collection README.');
        }
        if (j.status) console.log('status.code:', j.status.code, '-', j.status.message);
        assertJsonSchema({"type":"object","required":["status"],"properties":{"status":{"type":"object","required":["code"],"properties":{"code":{"type":["number","string"]},"message":{"type":"string"}}}}});
      }
    language: text/javascript
order: 758
