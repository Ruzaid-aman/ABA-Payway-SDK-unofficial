$kind: http-request
description: |-
  ## Create Payment Link
  RSA payload: `{ "mc_id": "...", "title": "...", "amount": "...", "currency": "...", "description": "...", "payment_limit": "...", "expired_date": 1234567890, "return_url": "base64...", "merchant_ref_no": "...", "payout": Array|null }`
  Hash: `request_time + merchant_id + merchant_auth`.

  - `expired_date` is a future Unix timestamp in seconds (this request defaults to seven days from now).
  - `return_url` inside the RSA payload must be **base64-encoded exactly once**. `{{return_url}}` accepts a plain HTTPS URL or its base64 form.
  - RSA encryption runs inside this collection with no package download. If secure randomness is unavailable, set `{{pl_merchant_auth}}` with the pre-encrypted payload.
  - On success, open the **Visualization** tab to copy or open the hosted payment link. The response also saves `data.id` as `{{payment_link_id}}` for Detail and Void.

  ```php
  $data = json_encode($payload);
  openssl_public_encrypt($data, $enc, $key, OPENSSL_PKCS1_PADDING);
  $merchant_auth = base64_encode($enc);
  ```
url: "{{baseUrl}}/api/merchant-portal/merchant-access/payment-link/create"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: request_time
      value: "{{request_time}}"
    - type: text
      key: merchant_id
      value: "{{merchant_id}}"
    - type: text
      key: merchant_auth
      value: "{{computed_merchant_auth}}"
    - type: text
      key: hash
      value: "{{computed_hash}}"
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers_v20260923_portable_v2') || pm.collectionVariables.get('__helpers_v20260923_portable') || pm.collectionVariables.get('__helpers_v20260923') || pm.collectionVariables.get('__helpers');
      if (__h && !pm.collectionVariables.get('__helpers_v20260923_portable_v2')) {
        __h += '\n\n' + "function openSslEncrypt(jsonStr, pem) {\n  if (typeof BigInt !== 'function' || typeof crypto === 'undefined' || typeof crypto.getRandomValues !== 'function') return null;\n  var CryptoJS = require('crypto-js');\n  function bytes(wordArray) {\n    var result = [];\n    for (var i = 0; i < wordArray.sigBytes; i++) result.push((wordArray.words[i >>> 2] >>> (24 - 8 * (i % 4))) & 255);\n    return result;\n  }\n  function wordArray(values) {\n    var words = [];\n    for (var i = 0; i < values.length; i++) words[i >>> 2] = (words[i >>> 2] || 0) | (values[i] << (24 - 8 * (i % 4)));\n    return CryptoJS.lib.WordArray.create(words, values.length);\n  }\n  function readTlv(data, position) {\n    var tag = data[position++];\n    var length = data[position++];\n    if (length & 128) {\n      var count = length & 127;\n      if (!count || count > 4) throw new Error('Invalid RSA public key DER length');\n      length = 0;\n      while (count--) length = length * 256 + data[position++];\n    }\n    var end = position + length;\n    if (end > data.length) throw new Error('Truncated RSA public key DER');\n    return { tag: tag, start: position, end: end };\n  }\n  function integer(data, part) {\n    if (part.tag !== 2) throw new Error('Invalid RSA public key integer');\n    var value = BigInt(0);\n    for (var i = part.start; i < part.end; i++) value = value * BigInt(256) + BigInt(data[i]);\n    return value;\n  }\n  function modPow(base, exponent, modulus) {\n    var result = BigInt(1);\n    while (exponent > 0) {\n      if (exponent & BigInt(1)) result = result * base % modulus;\n      base = base * base % modulus;\n      exponent >>= BigInt(1);\n    }\n    return result;\n  }\n  var encoded = String(pem || '').replace(/-----[^-]+-----/g, '').replace(/\\s/g, '');\n  var der = bytes(CryptoJS.enc.Base64.parse(encoded));\n  var outer = readTlv(der, 0);\n  if (outer.tag !== 48 || outer.end !== der.length) throw new Error('Expected SPKI RSA public key');\n  var algorithm = readTlv(der, outer.start);\n  var bitString = readTlv(der, algorithm.end);\n  if (algorithm.tag !== 48 || bitString.tag !== 3 || der[bitString.start] !== 0) throw new Error('Expected SPKI RSA public key');\n  var key = readTlv(der, bitString.start + 1);\n  var modulusPart = readTlv(der, key.start);\n  var exponentPart = readTlv(der, modulusPart.end);\n  if (key.tag !== 48 || exponentPart.end !== key.end) throw new Error('Invalid RSA public key');\n  var modulus = integer(der, modulusPart);\n  var exponent = integer(der, exponentPart);\n  var keyBytes = Math.ceil((modulus.toString(2).length) / 8);\n  var chunkSize = keyBytes - 11;\n  if (chunkSize < 1 || exponent < 3) throw new Error('Invalid RSA public key size or exponent');\n  var input = bytes(CryptoJS.enc.Utf8.parse(jsonStr));\n  var output = [];\n  for (var offset = 0; offset < input.length; offset += chunkSize) {\n    var chunk = input.slice(offset, offset + chunkSize);\n    var padLength = keyBytes - chunk.length - 3;\n    var block = [0, 2];\n    var random = new Uint8Array(padLength);\n    crypto.getRandomValues(random);\n    for (var j = 0; j < padLength; j++) {\n      while (random[j] === 0) crypto.getRandomValues(random.subarray(j, j + 1));\n      block.push(random[j]);\n    }\n    block.push(0);\n    block.push.apply(block, chunk);\n    var number = BigInt(0);\n    for (var k = 0; k < block.length; k++) number = number * BigInt(256) + BigInt(block[k]);\n    var encrypted = modPow(number, exponent, modulus);\n    var result = new Array(keyBytes);\n    for (var p = keyBytes - 1; p >= 0; p--) {\n      result[p] = Number(encrypted % BigInt(256));\n      encrypted /= BigInt(256);\n    }\n    output.push.apply(output, result);\n  }\n  return CryptoJS.enc.Base64.stringify(wordArray(output));\n}";
        pm.collectionVariables.set('__helpers_v20260923_portable_v2', __h);
      }
      if (!__h) throw new Error('The shared PayWay helper is missing. Re-import the complete collection.');
      eval(__h);
      // Create Payment Link - RSA payload per description; hash: request_time+merchant_id+merchant_auth
      var C = pm.collectionVariables;
      var reqTime = utcNow();
      var payload = {
        mc_id: C.get('merchant_id'),
        title: 'Test Payment Link',
        amount: fmtAmt(C.get('amount')),
        currency: C.get('currency'),
        description: 'Created from Postman',
        payment_limit: '50',
        expired_date: Math.floor(Date.now() / 1000) + 7 * 86400,
        return_url: ensureB64(C.get('return_url')),
        merchant_ref_no: C.get('merchant_ref')
      };
      var auth = rsaFallback(JSON.stringify(payload), C.get('rsa_public_key'), 'pl_merchant_auth');
      if (!auth) {
        console.log('SKIP: merchant_auth could not be computed. RSA secure randomness is unavailable and {{pl_merchant_auth}} is empty.');
        pm.execution.skipRequest();
      }
      var msg = reqTime + C.get('merchant_id') + auth;
      C.set('request_time', reqTime);
      C.set('computed_merchant_auth', auth);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('RSA payload:', JSON.stringify(payload));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Payment link request returned HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response content-type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has status object", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("status");
      });
      var result = pm.response.json();
      if (String(result.status && result.status.code) === '00' && result.data && result.data.id) {
        pm.collectionVariables.set('payment_link_id', String(result.data.id));
        var paymentUrl = String(result.data.payment_link || '');
        if (/^https:\/\/[^\s<>"']+$/.test(paymentUrl) && pm.visualizer && pm.visualizer.set) {
          var expiry = Number(result.data.expired_date);
          var expiryLabel = expiry > 0 ? new Date(expiry * 1000).toLocaleString() + ' (local time)' : 'No expiry set';
          var template = `
            <style>
              body { font: 14px/1.5 Arial, sans-serif; color: #17212b; background: #f6f8fb; margin: 0; padding: 24px; }
              .card { max-width: 680px; margin: auto; padding: 24px; background: #fff; border: 1px solid #dfe5eb; border-radius: 12px; box-shadow: 0 4px 18px rgba(20,40,60,.07); }
              h2 { margin: 0 0 4px; font-size: 20px; }
              .sub { color: #586777; margin: 0 0 18px; }
              .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
              .pill { background: #eef5fb; border-radius: 20px; padding: 5px 10px; font-size: 12px; }
              label { display: block; font-weight: 600; margin-bottom: 6px; }
              input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #bdc9d5; border-radius: 7px; font: inherit; }
              .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
              .button { display: inline-block; border: 0; border-radius: 7px; padding: 10px 15px; background: #0878c9; color: #fff; font: 600 14px Arial, sans-serif; text-decoration: none; cursor: pointer; }
              .button.secondary { background: #e8f0f7; color: #16527c; }
              .note { color: #607080; font-size: 12px; margin: 16px 0 0; overflow-wrap: anywhere; }
            </style>
            <main class="card">
              <h2>Payment link ready</h2>
              <p class="sub">Share this link with a sandbox payer.</p>
              <div class="meta"><span class="pill">{{amount}} {{currency}}</span><span class="pill">{{status}}</span><span class="pill">Expires: {{expiry}}</span></div>
              <label for="payway-link">Hosted payment URL</label>
              <input id="payway-link" type="text" value="{{url}}" readonly aria-label="Hosted payment URL">
              <div class="actions">
                <a class="button" href="{{url}}" target="_blank" rel="noopener noreferrer">Open payment page ↗</a>
                <button class="button secondary" id="copy-link" type="button">Copy link</button>
              </div>
              <p class="note" id="copy-status" role="status">If copying is blocked, select the URL above and press Ctrl+C. Link ID: {{id}}</p>
            </main>
            <script>
              (function () {
                var input = document.getElementById('payway-link');
                var status = document.getElementById('copy-status');
                document.getElementById('copy-link').addEventListener('click', function () {
                  input.focus(); input.select();
                  function fallback() {
                    var copied = typeof document.execCommand === 'function' && document.execCommand('copy');
                    status.textContent = copied ? 'Link copied.' : 'URL selected. Press Ctrl+C to copy it.';
                  }
                  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(input.value).then(function () { status.textContent = 'Link copied.'; }, fallback);
                  } else { fallback(); }
                });
              }());
            <\/script>`;
          pm.visualizer.set(template, {
            url: paymentUrl,
            id: String(result.data.id),
            amount: String(result.data.amount || ''),
            currency: String(result.data.currency || ''),
            status: String(result.data.status || ''),
            expiry: expiryLabel
          });
        }
      }
order: 1000
