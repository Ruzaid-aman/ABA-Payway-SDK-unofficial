      function modPow(base, exponent, modulus) {
        var result = BigInt(1);
        while (exponent > 0) {
          if (exponent & BigInt(1)) result = result * base % modulus;
          base = base * base % modulus;
          exponent >>= BigInt(1);
        }
        return result;
