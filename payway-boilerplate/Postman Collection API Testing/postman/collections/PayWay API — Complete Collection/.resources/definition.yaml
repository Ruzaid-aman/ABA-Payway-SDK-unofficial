      var tpl = '<html><head><meta charset="utf-8"><style>body{font:14px/1.5 sans-serif;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#222}.card{max-width:560px;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}h4{margin:0 0 8px}p{margin:0 0 16px;color:#555;font-size:13px}button{font:600 14px sans-serif;padding:10px 18px;border:0;border-radius:8px;background:#0a7d38;color:#fff;cursor:pointer}</style></head><body><div class="card"><h4>{{title}}</h4><p>{{note}}</p><p style="margin:-6px 0 16px;color:#8a8f98;font-size:12px">The checkout opens in a new browser tab. If nothing opens, allow pop-ups for Postman and click again.</p><form method="POST" action="{{action}}" target="_blank">{{{inputs}}}<button type="submit">Open payment page in a new tab &rarr;</button></form></div></body></html>';
      pm.visualizer.set(tpl, { title: String(title || ''), note: String(note || ''), action: String(action || ''), inputs: inputs });
    }
    function visualizeQr(dataUrl, qrText, title) {
      if (typeof pm.visualizer === 'undefined' || !pm.visualizer.set) return;
      // qrImage is the TEMPLATED PNG (qr_image_template): branding above/below the code
      // makes it non-square. Always scale proportionally (height:auto) - forcing a fixed
      // square squashes the image vertically and the QR stops scanning.
      var img = dataUrl
        ? '<div style="max-width:340px;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:12px"><img alt="QR code" style="display:block;width:100%;height:auto" src="' + dataUrl + '"></div>'
        : '<div id="qrbox" style="display:inline-block;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:12px">Rendering QR...</div>' +
          '<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"><\/script>' +
          '<script>try { new QRCode(document.getElementById("qrbox"), { text: ' + JSON.stringify(String(qrText || '')).replace(/</g, '\\u003c') + ', width: 300, height: 300 }); } catch (e) { document.getElementById("qrbox").textContent = "QR render failed - copy the string below into any QR tool."; }<\/script>';
      var tpl = '<html><head><meta charset="utf-8"><style>body{font:14px sans-serif;margin:16px;color:#222}code{display:block;white-space:pre-wrap;word-break:break-all;background:#f4f4f5;padding:10px;border-radius:6px;margin-top:14px;font-size:11px}h4{margin:0 0 12px}</style></head><body><h4>{{title}}</h4>{{{img}}}{{#if qrText}}<code>{{qrText}}</code>{{/if}}</body></html>';
      pm.visualizer.set(tpl, { title: String(title || 'Scan with the ABA Mobile app'), img: img, qrText: String(qrText || '') });
    }

