      var chunkSize = keyBytes - 11;
      if (chunkSize < 1 || exponent < 3) throw new Error('Invalid RSA public key size or exponent');
      var input = bytes(CryptoJS.enc.Utf8.parse(jsonStr));
      var output = [];
