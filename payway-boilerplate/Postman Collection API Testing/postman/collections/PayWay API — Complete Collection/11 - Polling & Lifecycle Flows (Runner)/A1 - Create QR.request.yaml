$kind: http-request
description: "Flow A step 1. Creates a KHQR. Sandbox note: the KHQR stays PENDING until paid. PayWay may push a callback when it settles; `transaction-detail` always sees the record, unlike check-transaction-2 (recent-window, card transactions)."
url: "{{baseUrl}}/api/payment-gateway/v1/payments/generate-qr"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "req_time": "{{req_time}}",
      "merchant_id": "{{merchant_id}}",
      "tran_id": "{{tran_id}}",
      "amount": "{{amount}}",
      "items": "{{items_b64}}",
      "first_name": "{{buyer_first_name}}",
      "last_name": "{{buyer_last_name}}",
      "email": "{{buyer_email}}",
      "phone": "{{buyer_phone}}",
      "purchase_type": "{{purchase_type}}",
      "payment_option": "{{payment_option}}",
      "callback_url": "{{callback_url_b64}}",
      "return_deeplink": "{{return_deeplink_b64}}",
      "currency": "{{currency}}",
      "custom_fields": "{{custom_fields_b64}}",
      "return_params": "{{return_params}}",
      "payout": "{{payout_b64}}",
      "lifetime": "{{lifetime}}",
      "qr_image_template": "{{qr_image_template}}",
      "hash": "{{computed_hash}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Restore the shared PayWay helper library (Postman runs every script in its own scope):
      var __h = pm.collectionVariables.get('__helpers_v20260923_portable_v2') || pm.collectionVariables.get('__helpers_v20260923_portable') || pm.collectionVariables.get('__helpers_v20260923') || pm.collectionVariables.get('__helpers');
      if (!__h) throw new Error('The shared PayWay helper is missing. Re-import the complete collection.');
      eval(__h);
      var C = pm.collectionVariables;
      C.set('poll_count', '0');
      C.set('poll_status', '');
      var reqTime = utcNow();
      var tranId = genTranId();
      var amount = fmtAmt(C.get('amount'));
      var itemsB64 = b64json((C.get('items_json') || '').trim() || '[{"name":"QR Poll","quantity":1,"price":0.10}]');
      var cbB64 = ensureB64(C.get('callback_url'));
      var rdl = b64json((C.get('return_deeplink_raw')||'').trim());
      var customB64 = b64json((C.get('custom_fields_json')||'').trim());
      var payoutB64 = b64json((C.get('payout_json')||'').trim());
      var rparams = (C.get('return_params_raw')||'').trim();
      var msg = reqTime + C.get('merchant_id') + tranId + amount + itemsB64
        + C.get('buyer_first_name') + C.get('buyer_last_name') + C.get('buyer_email') + C.get('buyer_phone')
        + C.get('purchase_type') + C.get('payment_option') + cbB64 + rdl + C.get('currency')
        + customB64 + rparams + payoutB64 + C.get('lifetime') + C.get('qr_image_template');
      C.set('req_time', reqTime);
      C.set('tran_id', tranId);
      C.set('last_tran_id', tranId);
      C.set('amount', amount);
      C.set('items_b64', itemsB64);
      C.set('callback_url_b64', cbB64);
      C.set('return_deeplink_b64', rdl);
      C.set('custom_fields_b64', customB64);
      C.set('payout_b64', payoutB64);
      C.set('return_params', rparams);
      C.set('computed_hash', hmac512(msg, C.get('secret_key')));
      console.log('b4hash:', msg);
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("QR created (status.code 0)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has valid JSON body with qrString and qrImage", function () {
          const responseJson = pm.response.json();
          pm.expect(responseJson).to.be.an('object');
          pm.expect(responseJson).to.have.property('qrString').that.is.a('string');
          pm.expect(responseJson).to.have.property('qrImage').that.is.a('string');
      });

      pm.test("qrImage is a valid base64 PNG data URL", function () {
          const responseJson = pm.response.json();
          pm.expect(responseJson.qrImage).to.match(/^data:image\/png;base64,/);
      });
    language: text/javascript
order: 2000
