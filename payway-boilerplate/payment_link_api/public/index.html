<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayWay Payment Link API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        input { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PayWay Payment Link API Test Application</h1>

        <div class="section">
            <h2>Create Payment Link</h2>
            <form id="create-form">
                <label>Title: <input type="text" name="title" value="Test Link 001"></label><br>
                <label>Amount: <input type="number" step="0.01" name="amount" value="0.02"></label><br>
                <label>Description: <input type="text" name="description" value="Payment link created from curl"></label><br>
                <label>Payment Limit: <input type="number" name="payment_limit" value="0"></label><br>
                <label>Return URL: <input type="text" name="return_url" value="https://6291d7e1cd0c91932b68dab7.mockapi.io/pushback/api/v1/response/pushbacks"></label><br>
                <label>Merchant Ref No: <input type="text" name="merchant_ref_no" value="ref00001"></label><br>
                <button type="button" onclick="calculateCreateHash()">Calculate Hash</button>
                <button type="button" onclick="createPaymentLink()">Create Payment Link</button>
            </form>
            <div id="create-hash-display"></div>
            <div id="create-result"></div>
        </div>

        <div class="section">
            <h2>Get Payment Link Details</h2>
            <form id="detail-form">
                <label>Payment Link ID: <input type="text" id="payment-link-id" value="T+ErECeC9uCGj90ylqGUvw=="></label><br>
                <button type="button" onclick="calculateDetailHash()">Calculate Hash</button>
                <button type="button" onclick="getPaymentLinkDetail()">Get Details</button>
            </form>
            <div id="detail-hash-display"></div>
            <div id="detail-result"></div>
        </div>
    </div>

    <script>
        async function calculateCreateHash() {
            const form = document.getElementById('create-form');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            const hashDisplay = document.getElementById('create-hash-display');
            hashDisplay.innerHTML = 'Calculating hash...';

            try {
                // Send a request to calculate hash without actually creating
                const response = await fetch('/calculate-create-hash', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                hashDisplay.innerHTML = '<h3>Calculated Hash:</h3><pre>' + JSON.stringify({
                    request_time: result.request_time,
                    merchant_auth_json: result.merchant_auth_json,
                    merchant_auth_encrypted: result.merchant_auth_encrypted,
                    hash: result.hash
                }, null, 2) + '</pre>';
            } catch (error) {
                hashDisplay.innerHTML = 'Error calculating hash: ' + error.message;
            }
        }

        async function createPaymentLink() {
            const form = document.getElementById('create-form');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            const resultDiv = document.getElementById('create-result');
            resultDiv.innerHTML = 'Creating payment link...';

            try {
                const response = await fetch('/create-payment-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                resultDiv.innerHTML = '<h3>API Response:</h3><pre>' + JSON.stringify(result.response, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
            }
        }

        async function calculateDetailHash() {
            const id = document.getElementById('payment-link-id').value;
            const hashDisplay = document.getElementById('detail-hash-display');
            hashDisplay.innerHTML = 'Calculating hash...';

            try {
                const response = await fetch('/calculate-detail-hash', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id })
                });
                const result = await response.json();
                hashDisplay.innerHTML = '<h3>Calculated Hash:</h3><pre>' + JSON.stringify({
                    request_time: result.request_time,
                    merchant_auth_json: result.merchant_auth_json,
                    merchant_auth_encrypted: result.merchant_auth_encrypted,
                    hash: result.hash
                }, null, 2) + '</pre>';
            } catch (error) {
                hashDisplay.innerHTML = 'Error calculating hash: ' + error.message;
            }
        }

        async function getPaymentLinkDetail() {
            const id = document.getElementById('payment-link-id').value;
            const resultDiv = document.getElementById('detail-result');
            resultDiv.innerHTML = 'Getting payment link details...';

            try {
                const response = await fetch('/detail-payment-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id })
                });
                const result = await response.json();
                resultDiv.innerHTML = '<h3>API Response:</h3><pre>' + JSON.stringify(result.response, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
