name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (TD-01 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks also scans past commits
      - name: Scan for leaked secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail the gate when leaks are found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Secret scan failed — rotate the exposed credential at the provider portal, purge it from history, then re-run."
          exit 1

  quality-gates:
    name: Typecheck · Lint · Tests
    runs-on: ${{ matrix.os }}
    needs: secret-scan
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.12.0', '22.x', '24.x']
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # dist must exist before the suite: the child-process suites
      # (cli.test.ts, agent-cli.test.ts, webhook-cli.test.ts) spawn dist/cli.js.
      - name: Build
        run: npm run build
      - name: Public package and documentation boundaries
        run: |
          npm run check:package
          npm run docs:api
          npm run check:public-docs
          npm run check:repository
      - name: Packed SDK and reference app
        run: |
          npm run smoke:package
          npm --prefix examples/first-payment run setup
          npm --prefix examples/first-payment run typecheck
          npm run smoke:example
      - name: Unit & integration tests
        run: npm test
      - name: Coverage (enforces floor thresholds from vitest.config.ts)
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=html
      - name: Upload coverage artifact
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage/
          retention-days: 14

  sqlite-contract:
    name: Optional SQLite backend
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Install optional native driver explicitly
        run: npm install --no-save --package-lock=false better-sqlite3@13.0.3
      - run: npm run build
      - run: npm test -- src/__tests__/webhook-storage-sqlite.test.ts src/__tests__/webhook-storage-factory.test.ts

  postman-collection:
    name: Postman collection gate
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install collection build dependencies
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: npm ci
      - name: Run collection test suite (structure · scripts · import shape · KHQR sim)
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: npm run test:yaml
      - name: Check dist export freshness (examples + v2.1 JSON)
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: node export_json.js --check
