name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (TD-01 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks also scans past commits
      - name: Scan for leaked secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail the gate when leaks are found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Secret scan failed — rotate the exposed credential at the provider portal, purge it from history, then re-run."
          exit 1

  quality-gates:
    name: Build · Typecheck · Lint · Tests
    runs-on: ${{ matrix.os }}
    needs: secret-scan
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.12.0', '22.x', '24.x']
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # dist must exist before the suite: the child-process suites
      # (cli.test.ts, agent-cli.test.ts, webhook-cli.test.ts) spawn dist/cli.js.
      # Build also gates typecheck:dist (it reads the emitted dist/index.d.ts).
      - name: Build
        run: npm run build
      - name: CJS bundle smoke (DX-BUILD-005)
        run: |
          node -e "const m = require('./dist/index.cjs'); if (typeof m.PayWay !== 'function' || typeof m.createWebhookServer !== 'function' || typeof m.verifyCallbackDetailed !== 'function') process.exit(1)"
          node dist/cli.cjs mcp --list-tools --json > cjs-cli-smoke.json
          node -e "const t = JSON.parse(require('fs').readFileSync('cjs-cli-smoke.json','utf8')); if (!Array.isArray(t) || t.length < 10) process.exit(1)"
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck:dist
        run: npm run typecheck:dist
      - name: Lint
        run: npm run lint
      # Allowlist self-test: the script existed but was invoked by no workflow
      # (audit addendum A-1); it verifies the gitleaks allowlist entries bite.
      # Runners have no gitleaks preinstalled — fetch the pinned official
      # release first (asset names verified against the v8.30.1 release API).
      - name: Install gitleaks (allowlist self-test dependency)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux) ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            macOS) ASSET="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz" ;;
            Windows) ASSET="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip" ;;
            *) echo "Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.download" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          case "$ASSET" in
            *.tar.gz) tar -xzf "$RUNNER_TEMP/gitleaks.download" -C "$RUNNER_TEMP/gitleaks-bin" ;;
            *.zip) powershell -NoProfile -Command "Expand-Archive -Force -Path '$RUNNER_TEMP/gitleaks.download' -DestinationPath '$RUNNER_TEMP/gitleaks-bin'" ;;
          esac
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret allowlist self-test
        run: npm run check:secret-allowlists
      - name: Rules registry generated-module check (DX-KNOW-001)
        run: npm run gen:rules -- --check
      - name: Public package and documentation boundaries
        run: |
          npm run check:package
          npm run docs:api
          npm run check:public-docs
          npm run check:repository
      - name: Packed SDK and reference app
        run: |
          npm run smoke:package
          npm --prefix examples/first-payment run setup
          npm --prefix examples/first-payment run typecheck
          npm run smoke:example
      - name: Unit & integration tests
        run: npm test
      - name: Coverage (enforces floor thresholds from vitest.config.ts)
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=html
      - name: Upload coverage artifact
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage/
          retention-days: 14

  sqlite-contract:
    name: Optional SQLite backend
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Install optional native driver explicitly
        run: npm install --no-save --package-lock=false better-sqlite3@13.0.3
      - run: npm run build
      - run: npm test -- src/__tests__/webhook-storage-sqlite.test.ts src/__tests__/webhook-storage-factory.test.ts

  postman-collection:
    name: Postman collection gate
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install collection build dependencies
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: npm ci
      - name: Run collection test suite (structure · scripts · import shape · KHQR sim)
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: npm run test:yaml
      - name: Check dist export freshness (examples + v2.1 JSON)
        working-directory: payway-boilerplate/Postman Collection API Testing/_build
        run: node export_json.js --check
