name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (TD-01 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks also scans past commits
      - name: Scan for leaked secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail the gate when leaks are found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Secret scan failed — rotate the exposed credential at the provider portal, purge it from history, then re-run."
          exit 1

  quality-gates:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & integration tests
        run: npm test