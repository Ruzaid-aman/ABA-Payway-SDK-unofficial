name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (TD-01 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks also scans past commits
      - name: Scan for leaked secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail the gate when leaks are found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Secret scan failed — rotate the exposed credential at the provider portal, purge it from history, then re-run."
          exit 1

  quality-gates:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # dist must exist before the suite: the child-process suites
      # (cli.test.ts, agent-cli.test.ts, webhook-cli.test.ts) spawn dist/cli.js.
      - name: Build
        run: npm run build
      - name: Public package and documentation boundaries
        run: |
          npm run check:package
          npm run check:public-docs
      - name: Packed SDK and reference app
        if: matrix.node-version == '22.x'
        run: |
          npm run smoke:package
          npm --prefix examples/first-payment run setup
          npm --prefix examples/first-payment run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Coverage (enforces floor thresholds from vitest.config.ts)
        if: matrix.node-version == '22.x'
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=html
      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage/
          retention-days: 14
